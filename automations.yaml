- id: '1735398400000'
  alias: 'Vakantie: Automatisch uit voor thuiskomst'
  description: Schakelt vakantie modus uit 4 uur voor einde van vakantie event zodat
    huis kan opwarmen
  triggers:
  - trigger: time_pattern
    hours: '*'
    minutes: '0'
  conditions:
  - condition: state
    entity_id: input_boolean.vakantie_modus
    state: 'on'
  - condition: state
    entity_id: calendar.gezin
    state: 'on'
  - condition: template
    value_template: '{{ ''vakantie'' in state_attr(''calendar.gezin'', ''message'')
      | lower }}'
  - condition: template
    value_template: "{% set end_time = state_attr('calendar.gezin', 'end_time') %}
      {% if end_time %}\n  {{ now() >= (end_time | as_datetime | as_local) - timedelta(hours=4)
      }}\n{% else %}\n  false\n{% endif %}\n"
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.vakantie_modus
    data: {}
  - action: notify.mobile_app_iphone_van_bram
    data:
      title: Vakantie modus uitgeschakeld
      message: Het huis wordt voorverwarmd voor jullie thuiskomst over ~4 uur!
- id: '1735398500000'
  alias: 'Vakantie: Backup detectie lange afwezigheid'
  description: Vraagt of vakantie modus aan moet als jullie lang weg zijn zonder agenda
    event
  triggers:
  - trigger: state
    entity_id:
    - group.bewoners
    to: not_home
    for:
      hours: 24
  conditions:
  - condition: state
    entity_id: input_boolean.vakantie_modus
    state: 'off'
  - condition: template
    value_template: "{% set is_vakantie = state_attr('calendar.gezin', 'message')
      and\n                    'vakantie' in state_attr('calendar.gezin', 'message')
      | lower %}\n{{ not is_vakantie or is_state('calendar.gezin', 'off') }}\n"
  actions:
  - action: notify.mobile_app_iphone_van_bram
    data:
      title: Lange afwezigheid gedetecteerd
      message: Jullie zijn al 24+ uur niet thuis. Moet ik vakantie modus aanzetten?
      data:
        actions:
        - action: VAKANTIE_MODUS_AAN
          title: Ja, vakantie modus
          icon: sfsymbols:airplane.departure
        - action: VAKANTIE_MODUS_NEE
          title: Nee, dagje weg
          icon: sfsymbols:house
