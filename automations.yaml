    - binary_sensor.airco_zolder_mag_aan
    id: Airco Mag Aan
    from:
    to: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    enabled: false
    trigger: state
  - entity_id:
    - binary_sensor.airco_zolder_mag_aan
    id: Airco Moet Uit
    from:
    to: 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    trigger: state
  - entity_id:
    - sensor.airco_zolder_ideale_temperatuur
    id: Temperatuur Veranderd
    trigger: state
  - entity_id:
    - schedule.verwarming_zolder
    to: 'off'
    id: Airco Moet Uit
    trigger: state
  - entity_id:
    - binary_sensor.airco_zolder_mag_afkoelen
    to: 'on'
    id: Afkoelen
    trigger: state
  - entity_id:
    - binary_sensor.airco_zolder_mag_verwarmen
    to: 'on'
    id: Verwarmen
    trigger: state
  - entity_id:
    - binary_sensor.airco_zolder_mag_ventileren
    to: 'on'
    id: Ventileren
    trigger: state
  - trigger: state
    entity_id:
    - climate.airco_zolder
    to: 'off'
    id: Airco Zolder is Uitgegaan
  - trigger: state
    entity_id:
    - binary_sensor.airco_zolder_mag_aan
    - binary_sensor.airco_zolder_mag_afkoelen
    - binary_sensor.airco_zolder_mag_ventileren
    - binary_sensor.airco_zolder_mag_verwarmen
  - trigger: time_pattern
    hours: '*'
    minutes: '*'
    seconds: '10'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: trigger
          id:
          - Afkoelen
          - Airco Zolder is Uitgegaan
          enabled: false
        - condition: state
          entity_id: binary_sensor.airco_zolder_mag_afkoelen
          state: 'on'
        - condition: state
          entity_id: climate.airco_zolder
          state: 'off'
      sequence:
      - data: {}
        action: climate.turn_on
        target:
          entity_id: climate.airco_zolder
      - metadata: {}
        data:
          hvac_mode: cool
        target:
          entity_id: climate.airco_zolder
        action: climate.set_hvac_mode
      - data:
          temperature: '{{states(''sensor.airco_zolder_ideale_temperatuur'') | float
            }}'
        target:
          entity_id: climate.airco_zolder
        action: climate.set_temperature
      - action: climate.set_swing_mode
        metadata: {}
        data:
          swing_mode: Highest
        target:
          entity_id: climate.airco_zolder
      - action: notify.mobile_app_iphone_van_bram
        metadata: {}
        data:
          message: 'Airco zolder is gaan koelen '
      alias: Mag afkoelen
    - conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: binary_sensor.airco_zolder_mag_aan
          state: 'off'
        - condition: or
          conditions:
          - condition: state
            entity_id: climate.airco_zolder
            state: heat
          - condition: state
            entity_id: climate.airco_zolder
            state: cool
        enabled: true
      sequence:
      - metadata: {}
        data: {}
        target:
          entity_id: climate.airco_zolder
        action: climate.turn_off
      - action: notify.mobile_app_iphone_van_bram
        metadata: {}
        data:
          message: Airco zolder is uitgezet
    - conditions:
      - condition: and
        conditions:
        - condition: trigger
          id:
          - Verwarmen
          - Airco Zolder is Uitgegaan
          enabled: false
        - condition: state
          entity_id: binary_sensor.airco_zolder_mag_verwarmen
          state: 'on'
        - condition: state
          entity_id: climate.airco_zolder
          state: 'off'
      sequence:
      - target:
          entity_id: climate.airco_zolder
        data: {}
        action: climate.turn_on
      - metadata: {}
        data:
          hvac_mode: heat
        target:
          entity_id: climate.airco_zolder
        action: climate.set_hvac_mode
      - data:
          temperature: 20
        target:
          entity_id: climate.airco_zolder
        action: climate.set_temperature
      - action: climate.set_fan_mode
        metadata: {}
        data:
          fan_mode: 1 Lowest
        target:
          entity_id: climate.airco_zolder
      - action: climate.set_swing_mode
        metadata: {}
        data:
          swing_mode: Lowest
        target:
          entity_id: climate.airco_zolder
      - action: notify.mobile_app_iphone_van_bram
        metadata: {}
        data:
          message: Airco zolder is gaan verwarmen
      alias: Mag verwarmen
    - conditions:
      - condition: and
        conditions:
        - condition: trigger
          id:
          - Airco Zolder is Uitgegaan
          - Ventileren
          enabled: false
        - condition: state
          entity_id: binary_sensor.airco_zolder_mag_ventileren
          state: 'on'
        - condition: or
          conditions:
          - condition: state
            entity_id: climate.airco_zolder
            state: heat
          - condition: state
            entity_id: climate.airco_zolder
            state: cool
      sequence:
      - target:
          entity_id: climate.airco_zolder
        data: {}
        action: climate.turn_on
      - metadata: {}
        data:
          hvac_mode: fan_only
        target:
          entity_id: climate.airco_zolder
        action: climate.set_hvac_mode
      - action: climate.set_fan_mode
        metadata: {}
        data:
          fan_mode: 1 Lowest
        target:
          entity_id: climate.airco_zolder
      - action: climate.set_swing_mode
        metadata: {}
        data:
          swing_mode: Lowest
        target:
          entity_id: climate.airco_zolder
      - action: notify.mobile_app_iphone_van_bram
        metadata: {}
        data:
          message: Airco zolder is gaan ventileren
      alias: Mag ventileren
  - action: select.select_option
    target:
      entity_id: select.airco_zolder_horizontal_swing_direction
    data:
      option: Center-Center
  mode: single
