- id: '1664394061308'
  alias: 'Schakelaar: Thuiswerkdag'
  description: ''
  triggers:
  - event: start
    offset: 0:0:0
    entity_id: calendar.bram_sibi_nl
    trigger: calendar
  - event: end
    offset: 0:0:0
    entity_id: calendar.bram_sibi_nl
    trigger: calendar
  - event: start
    offset: 0:0:0
    entity_id: calendar.bram
    trigger: calendar
  - event: end
    offset: 0:0:0
    entity_id: calendar.bram
    trigger: calendar
  conditions:
