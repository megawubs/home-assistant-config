- id: '1664399759706'
  alias: 'Klimaat: Woonkamer'
  description: ''
  triggers:
  - entity_id:
    - schedule.verwarming_beneden
    to: 'on'
    from: 'off'
    id: verwarmen
    trigger: state
  - entity_id:
    - schedule.verwarming_beneden
    to: 'off'
    from: 'on'
    id: laag
    trigger: state
  - trigger: state
    entity_id:
    - switch.zoned_heating
    attribute: override_active
    to: 'True'
    id: Zoned Heating is gestart
  conditions: []
  actions:
  - alias: Verwarmen naar 17
    if:
    - condition: trigger
      id: verwarmen
    - condition: state
      entity_id: group.bewoners
      state: home
      alias: Iemand is thuis
    then:
    - data:
        temperature: 19
      action: climate.set_temperature
      target:
        entity_id:
        - climate.radiator_kraan_keukentafel_thermostaat
        - climate.radiator_kraan_woonkamer_thermostaat
    - data:
        message: Woonkamer temperatuur is aangepast
      alias: Melding naar de Baas!
      action: notify.mobile_app_iphone_van_bram
  - alias: Verwarmen naar 13
    if:
    - condition: and
      conditions:
      - condition: trigger
        id: laag
      - condition: state
        entity_id: person.beppe
        state: not_home
      alias: Als triggered door laag en beppe is er niet
    then:
    - data:
        temperature: 13
      target:
        entity_id:
        - climate.radiator_kraan_keukentafel_thermostaat
        - climate.radiator_kraan_woonkamer_thermostaat
      action: climate.set_temperature
    - data:
        message: Woonkamer temperatuur is aangepast
      alias: Melding naar de Baas!
      action: notify.mobile_app_iphone_van_bram
    else: []
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id: laag
      - condition: state
        entity_id: person.beppe
        state: home
      alias: Als triggered door laag en beppe is er
    then:
    - wait_for_trigger:
      - entity_id:
        - group.bewoners
        to: home
        for:
          hours: 0
          minutes: 0
          seconds: 0
        trigger: state
      alias: Wachten tot er iemand thuis komt
      timeout:
        hours: 0
        minutes: 0
        seconds: 0
        milliseconds: 0
      continue_on_timeout: false
    - data:
        temperature: 13
      action: climate.set_temperature
      target:
        entity_id:
        - climate.radiator_kraan_keukentafel_thermostaat
        - climate.radiator_kraan_woonkamer_thermostaat
    - data:
        message: Woonkamer temperatuur is aangepast
      alias: Melding naar de Baas!
      action: notify.mobile_app_iphone_van_bram
  - if:
    - condition: trigger
      id:
      - Zoned Heating is gestart
    then:
    - action: notify.bram
      metadata: {}
      data:
        message: Zoned heating is gestart!
  mode: queued
  max: 10
- id: '1664690613483'
  alias: 'Media: Woonkamer'
  description: ''
  triggers:
  - entity_id:
    - media_player.woonkamer
    attribute: source
    to: Spotify
    id: spotify-starts
    trigger: state
  - entity_id:
    - media_player.woonkamer
    attribute: source
    id: spotify-stops
    trigger: state
    from: Spotify
  - entity_id:
    - media_player.arcadyan
    - media_player.woonkamer_tv
    to:
    - 'off'
    - stand-by
    id: tv-off
    trigger: state
  - entity_id:
    - media_player.arcadyan
    - media_player.woonkamer_tv
    to: standby
    id: tv-off
    trigger: state
  - entity_id:
    - media_player.woonkamer_tv
    - media_player.arcadyan
    to:
    - playing
    - 'on'
    - idle
    id: tv-on
    trigger: state
  - entity_id:
    - media_player.woonkamer_tv
    attribute: media_content_type
    to: music
    id: tv-muziek
    trigger: state
  conditions: []
  actions:
  - if:
    - condition: or
      conditions:
      - condition: trigger
        id:
        - spotify-starts
      - condition: and
        conditions:
        - condition: trigger
          id:
          - tv-muziek
        - condition: state
          entity_id: media_player.woonkamer_tv
          state: playing
        alias: Woonkamer TV Speelt muziek af
    then:
    - data:
        master: media_player.woonkamer
        entity_id: media_player.keuken
      enabled: false
      action: linkplay.join
    - data:
        master: media_player.woonkamer
        entity_id: media_player.eettafel
      enabled: false
      action: linkplay.join
    - data: {}
      action: script.media_groepeer_woonkamer
    - data:
        is_volume_muted: false
      target:
        entity_id:
        - media_player.benedenverdieping
      alias: 'Unmute media speler woonkamer '
      action: media_player.volume_mute
    - data:
        value: 0.05
      target:
        entity_id: input_number.volume_benedenverdieping
      enabled: true
      action: input_number.set_value
  - if:
    - condition: trigger
      id: spotify-stops
    then:
    - action: media_player.unjoin
      metadata: {}
      data: {}
      target:
        entity_id:
        - media_player.eettafel
        - media_player.keuken
        - media_player.woonkamer
    - data:
        source: Line In
      target:
        entity_id: media_player.woonkamer
      action: media_player.select_source
    - data: {}
      action: script.volume_benedenverdieping_laag
    - data:
        is_volume_muted: true
      target:
        entity_id: media_player.woonkamer
      action: media_player.volume_mute
  - if:
    - condition: trigger
      id: tv-off
    then:
    - data: {}
      action: script.volume_benedenverdieping_laag
    - data:
        is_volume_muted: true
      target:
        entity_id: media_player.woonkamer
      action: media_player.volume_mute
  - if:
    - condition: trigger
      id: tv-on
    then:
    - data:
        is_volume_muted: false
      target:
        entity_id: media_player.woonkamer
      action: media_player.volume_mute
    - data:
        source: Line In
      target:
        entity_id: media_player.woonkamer
      action: media_player.select_source
    - action: media_player.unjoin
      target:
        device_id:
        - dd502bc7f0a71951eba9098880360a6d
        - 6739fba0a30259f57078918e51239f75
      data: {}
    - if:
      - condition: state
        entity_id: media_player.woonkamer_tv
        attribute: media_content_type
        state: music
      then:
      - data: {}
        action: script.media_groepeer_woonkamer
      - data:
          is_volume_muted: false
        target:
          entity_id:
          - media_player.benedenverdieping
        alias: 'Unmute media speler woonkamer '
        action: media_player.volume_mute
    - data:
        value: 0.3
      target:
        entity_id: input_number.volume_benedenverdieping
      enabled: true
      action: input_number.set_value
    - action: media_player.volume_set
      metadata: {}
      data:
        volume_level: 1
      target:
        entity_id: media_player.arcadyan
  mode: single
