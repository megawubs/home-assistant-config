- id: '1609076575583'
  alias: 'Verlichting: Hal'
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.activiteit_in_de_hal
    to: 'on'
    trigger: state
    id: aan
  - entity_id:
    - binary_sensor.activiteit_in_de_hal
    to: 'off'
    trigger: state
    id: uit
    for:
      hours: 0
      minutes: 0
      seconds: 30
  conditions: []
  actions:
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - aan
      - condition: state
        entity_id: binary_sensor.licht_intensiteit_in_de_woonkamer_onder_ingestelde_waarde
        state: 'on'
        enabled: true
    then:
    - data:
        brightness_pct: 100
      target:
        entity_id:
        - light.lamp_hal_licht
      action: light.turn_on
  - if:
    - condition: trigger
      id:
      - uit
    then:
    - data: {}
      target:
        entity_id:
        - light.lamp_hal_licht
      action: light.turn_off
  mode: restart
- id: '1609196365224'
  alias: 'Verlichting: Woonkamer'
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.activiteit_in_de_woonkamer
    to: 'on'
    from: 'off'
    id: beweging gedetecteerd
    trigger: state
  - event: sunset
    offset: -00:45:00
    id: zon gaat onder
    alias: Zon gaat onder
    enabled: false
    trigger: sun
  - event: sunrise
    offset: +01:30:00
    id: zon komt op
    alias: Zon komt op
    trigger: sun
  - entity_id:
    - input_boolean.modus_slaap
    from: 'off'
    to: 'on'
    id: Slaap modus gaat aan
    trigger: state
  - entity_id:
    - binary_sensor.activiteit_in_de_woonkamer
    to: 'off'
    from: 'on'
    id: Inactiviteit gedetecteerd
    trigger: state
  - entity_id:
    - binary_sensor.licht_intensiteit_in_de_woonkamer_onder_ingestelde_waarde
    from: 'off'
    to: 'on'
    id: Het wordt donker
    trigger: state
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: input_boolean.automatische_verlichting_woonkamer
      state: 'on'
    - condition: state
      entity_id: input_boolean.modus_gast
      state: 'off'
  actions:
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id: beweging gedetecteerd
        enabled: true
      - condition: state
        entity_id: light.woonkamer
        state: 'off'
        enabled: true
      - condition: sun
        after: sunset
        after_offset: +00:45:00
        enabled: false
      - condition: state
        entity_id: input_boolean.modus_slaap
        state: 'off'
      - condition: state
        entity_id: binary_sensor.licht_intensiteit_in_de_woonkamer_onder_ingestelde_waarde
        state: 'on'
      alias: Getriggerd bij beweging en woonkamer is uit en de zon gaat bijna onder
        en slaap modus is uit
    then:
    - data: {}
      action: script.woonkamer_aan
    - data:
        message: Woonkamer aan omdat er beweging was en het is donker genoeg
      action: notify.bram
    alias: Woonkamer aan als er beweging was en wanneer het donker is als we wakker
      zijn
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id: zon gaat onder
      - condition: state
        entity_id: binary_sensor.activiteit_in_de_woonkamer_voor_afgelopen_10_minuten
        state: 'on'
      alias: Zon gaat onder en er was beweging
    then:
    - data: {}
      action: script.woonkamer_aan
    - data:
        message: Woonkamer aan omdat de zon onder gaat en er activiteit was in de
          woonkamer
      action: notify.bram
    alias: Woonkamer aan als zon onder gaat en er beweging was
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id: zon komt op
      - condition: state
        entity_id: light.woonkamer
        state: 'on'
      alias: Woonkamer uit als de zon op komt
    then:
    - data: {}
      action: script.woonkamer_uit
  - alias: Nacht modus wanneer beweging in de woonkamer in de nacht. Automatisch uit
      gaan wanneer er geen beweging meer is
    if:
    - condition: and
      conditions:
      - condition: trigger
        id: beweging gedetecteerd
      - condition: state
        entity_id: input_boolean.modus_slaap
        state: 'on'
    then:
    - data:
        brightness_pct: 30
        transition: 9
      target:
        entity_id:
        - light.eettafel
        - light.box_links
        - light.box_rechtss
      action: light.turn_on
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id: Slaap modus gaat aan
      - condition: state
        entity_id: light.woonkamer
        state: 'on'
      - condition: state
        entity_id: binary_sensor.activiteit_in_de_woonkamer
        state:
        - 'on'
        for:
          hours: 0
          minutes: 30
          seconds: 0
    then:
    - wait_for_trigger:
      - entity_id:
        - binary_sensor.activiteit_in_de_woonkamer_voor_afgelopen_half_uur
        from: 'on'
        to: 'off'
        trigger: state
      continue_on_timeout: false
    - data:
        message: Woonkamer uit gedaan!
      action: notify.bram
    - data: {}
      action: script.woonkamer_uit
    enabled: false
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id: Inactiviteit gedetecteerd
      - condition: state
        entity_id: light.woonkamer
        state: 'on'
      alias: Woonkamer uit als lampen aan zijn en er geen activteit is
    then:
    - data: {}
      target:
        area_id: 3baf8165348041e1b29208776b5bf03d
        entity_id: media_player.woonkamer
      enabled: false
      action: media_player.media_stop
    - data: {}
      action: script.woonkamer_uit
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id: Het wordt donker
      - condition: state
        entity_id: binary_sensor.activiteit_in_de_woonkamer
        state: 'on'
    then:
    - data: {}
      action: script.woonkamer_aan
  mode: restart
