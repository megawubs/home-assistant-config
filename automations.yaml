- id: '1713989923973'
  alias: 'Klimaat & Verlichting: Zolder'
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.activiteit_op_zolder
    to: 'on'
    id: Activiteit
    trigger: state
  - entity_id:
    - binary_sensor.activiteit_op_zolder
    to: 'off'
    id: Inactiviteit
    for:
      hours: 0
      minutes: 0
      seconds: 0
    trigger: state
  - entity_id:
    - binary_sensor.activiteit_op_zolder
    to: 'off'
    id: Inactiviteit 3 Min
    for:
      hours: 0
      minutes: 3
      seconds: 0
    trigger: state
  - entity_id:
    - binary_sensor.activiteit_op_zolder
    to: 'off'
    id: Inactiviteit 6  Min
    for:
      hours: 0
      minutes: 6
      seconds: 0
    trigger: state
  - entity_id:
    - schedule.verwarming_zolder
    id: Schedule
    to: 'on'
    trigger: state
  - entity_id:
    - schedule.verwarming_zolder
    id: Schedule Off
    to: 'off'
    trigger: state
  conditions: []
  actions:
  - parallel:
    - alias: Bureau apparatuur aan als dat mag
      if:
      - condition: and
        conditions:
        - condition: trigger
          id:
          - Activiteit
          - Schedule
        - condition: state
          state: 'on'
          entity_id: input_boolean.thuiswerkdag
        - condition: state
          entity_id: schedule.verwarming_zolder
          state: 'on'
        - condition: state
          entity_id: input_boolean.automatische_verlichting_woonkamer
          state: 'on'
          enabled: false
      then:
      - action: switch.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: switch.vloerverwarming_bureau_zolder
      - action: switch.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: switch.stekkerdoos_bureau_zolder
      enabled: true
    - if:
      - condition: and
        conditions:
        - condition: state
          entity_id: input_boolean.zolder_automatiche_verlichting
          state: 'on'
        - condition: trigger
          id:
          - Activiteit
      then:
      - data:
          brightness_pct: 70
          transition: 2
        target:
          entity_id: light.kantoor_lamp
        action: light.turn_on
      alias: Zolder lamp aan bij activiteit
    - alias: Zolder lamp uit bij inactiviteit
      if:
      - condition: and
        conditions:
        - condition: trigger
          id:
          - Inactiviteit
        - condition: state
          entity_id: input_boolean.zolder_automatiche_verlichting
          state: 'on'
      then:
      - data:
          transition: 2
        target:
          entity_id: light.kantoor_lamp
        action: light.turn_off
      - data: {}
        action: light.turn_off
        target:
          entity_id: light.nachtkastjes_zolder
    - alias: Zolder verwarming uit bij inactiviteit
      if:
      - condition: trigger
        id:
        - Inactiviteit 3 Min
        - Inactiviteit 6  Min
        - Schedule Off
      then:
      - metadata: {}
        data: {}
        action: script.zolder_verwarming_uit
    - alias: Zet Randaparatuur uit bij inactiviteit voor 3 min
      if:
      - condition: trigger
        id:
        - Inactiviteit
      then:
      - metadata: {}
        data: {}
        target:
          entity_id:
          - switch.stekkerdoos_bureau_zolder
        action: switch.turn_off
        enabled: true
  mode: restart
- id: '1721486084058'
  alias: Airco Woonkamer
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.airco_woonkamer_mag_aan
    id: Airco Mag Aan
    from:
    to: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    enabled: false
    trigger: state
  - entity_id:
    - binary_sensor.airco_woonkamer_mag_aan
    id: Airco Moet Uit
    from:
    to: 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    trigger: state
  - entity_id:
    - sensor.airco_woonkamer_ideale_temperatuur
    id: Temperatuur Veranderd
    trigger: state
  - entity_id:
    - schedule.airco_woonkamer
    to: 'off'
    id: Airco Moet Uit
    trigger: state
  - entity_id:
    - binary_sensor.airco_woonkamer_mag_afkoelen
    to: 'on'
    id: Afkoelen
    trigger: state
  - entity_id:
    - binary_sensor.airco_woonkamer_mag_verwarmen
    to: 'on'
    id: Verwarmen
    trigger: state
  - entity_id:
    - binary_sensor.airco_woonkamer_mag_ventileren
    to: 'on'
    id: Airco Moet Uit
    trigger: state
    enabled: true
    for:
      hours: 0
      minutes: 30
      seconds: 0
  - trigger: state
    entity_id:
    - climate.airco_woonkamer
    from: unavailable
    to:
    id: Beschikbaar
  - entity_id:
    - binary_sensor.airco_woonkamer_mag_ventileren
    to: 'on'
    id: Ventileren
    trigger: state
    enabled: true
    for:
      hours: 0
      minutes: 0
      seconds: 0
  - trigger: time_pattern
    hours: '*'
    minutes: '*'
    seconds: '30'
  - trigger: state
    entity_id:
    - input_number.airco_woonkamer_drempelwaarde_verwarmen
  - trigger: state
    entity_id:
    - input_number.airco_woonkamer_temperatuur_offset
    for:
      hours: 0
      minutes: 0
      seconds: 10
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Temperatuur Veranderd
      - condition: state
        entity_id: binary_sensor.airco_woonkamer_mag_aan
        state: 'on'
      sequence:
      - data:
          temperature: '{{states(''sensor.airco_woonkamer_ideale_temperatuur'') |
            float }}'
        target:
          label_id: airco_beneden
        action: climate.set_temperature
    - conditions:
      - condition: trigger
        id:
        - Afkoelen
        enabled: false
      - condition: state
        entity_id: binary_sensor.airco_woonkamer_mag_afkoelen
        state: 'on'
      sequence:
      - target:
          entity_id: climate.airco_woonkamer
        data: {}
        action: climate.turn_on
        enabled: false
      - metadata: {}
        data:
          hvac_mode: cool
        target:
          label_id: airco_beneden
        action: climate.set_hvac_mode
      - data:
          temperature: '{{states(''sensor.airco_woonkamer_ideale_temperatuur'') |
            float }}'
        target:
          label_id: airco_beneden
        action: climate.set_temperature
      - action: climate.set_swing_mode
        metadata: {}
        data:
          swing_mode: Highest
        target:
          label_id: airco_beneden
      - action: select.select_option
        target:
          entity_id: select.airco_woonkamer_horizontal_swing_direction
        data:
          option: Right-Right
      - action: select.select_option
        data:
          option: Center-Center
        target:
          entity_id: select.airco_keuken_horizontal_swing_direction
      - action: notify.mobile_app_iphone_van_bram
        metadata: {}
        data:
          message: 'Airco woonkamer is gaan koelen '
      alias: Afkoelen
    - conditions:
      - condition: and
        conditions:
        - condition: or
          conditions:
          - condition: state
            entity_id: binary_sensor.airco_woonkamer_mag_aan
            state: 'off'
          - condition: state
            entity_id: binary_sensor.airco_woonkamer_mag_ventileren
            state: 'on'
            for:
              hours: 0
              minutes: 30
              seconds: 0
            enabled: false
          enabled: true
        - condition: or
          conditions:
          - condition: state
            entity_id: climate.airco_woonkamer
            state: cool
          - condition: state
            entity_id: climate.airco_woonkamer
            state: fan_only
          - condition: state
            entity_id: climate.airco_woonkamer
            state: dry
          - condition: state
            entity_id: climate.airco_woonkamer
            state: auto
          - condition: state
            entity_id: climate.airco_woonkamer
            state: heat
      sequence:
      - metadata: {}
        data: {}
        target:
          label_id: airco_beneden
        action: climate.turn_off
      - action: notify.mobile_app_iphone_van_bram
        metadata: {}
        data:
          message: Airco woonkamer is uitgezet
      alias: Uitschakelen
    - conditions:
      - condition: state
        entity_id: binary_sensor.airco_woonkamer_mag_verwarmen
        state: 'on'
      - condition: or
        conditions:
        - condition: state
          entity_id: climate.airco_woonkamer
          state: cool
        - condition: state
          entity_id: climate.airco_woonkamer
          state: fan_only
        - condition: state
          entity_id: climate.airco_woonkamer
          state: dry
        - condition: state
          entity_id: climate.airco_woonkamer
          state: auto
        - condition: state
          entity_id: climate.airco_woonkamer
          state: 'off'
        - condition: state
          entity_id: climate.airco_keuken
          state: 'off'
        enabled: true
      sequence:
      - metadata: {}
        data:
          hvac_mode: heat
        target:
          label_id: airco_beneden
        action: climate.set_hvac_mode
      - data:
          temperature: '{{states(''sensor.airco_woonkamer_ideale_temperatuur'') |
            float }}'
        target:
          label_id: airco_beneden
        action: climate.set_temperature
      - action: climate.set_fan_mode
        metadata: {}
        data:
          fan_mode: 3 High
        target:
          label_id: airco_beneden
      - action: climate.set_swing_mode
        metadata: {}
        data:
          swing_mode: Normal
        target:
          label_id: airco_beneden
        enabled: false
      - action: select.select_option
        metadata: {}
        data:
          option: Right-Right
        target:
          entity_id: select.airco_woonkamer_horizontal_swing_direction
        enabled: false
      - action: select.select_option
        data:
          option: Center-Center
        target:
          entity_id: select.airco_keuken_horizontal_swing_direction
        enabled: false
      alias: Verwarmen
    - conditions:
      - condition: state
        entity_id: binary_sensor.airco_woonkamer_mag_ventileren
        state: 'on'
      sequence:
      - data:
          temperature: '{{ state_attr(''climate.airco_woonkamer'', ''current_temperature'')
            | float }}'
          hvac_mode: heat
        target:
          entity_id: climate.airco_woonkamer
        action: climate.set_temperature
        enabled: false
      - target:
          label_id: airco_beneden
        data: {}
        action: climate.turn_on
        enabled: true
      - action: climate.set_fan_mode
        metadata: {}
        data:
          fan_mode: 2 Low
        target:
          label_id: airco_beneden
        enabled: true
      - action: climate.set_swing_mode
        metadata: {}
        data:
          swing_mode: Normal
        target:
          entity_id: climate.airco_woonkamer
        enabled: false
      - action: select.select_option
        target:
          entity_id: select.airco_woonkamer_horizontal_swing_direction
        data:
          option: Right-Right
        enabled: false
      alias: Ventileren
    - conditions:
      - condition: trigger
        id:
        - Verwarmen
      sequence:
      - action: notify.mobile_app_iphone_van_bram
        metadata: {}
        data:
          message: Airco woonkamer is gaan verwarmen
        enabled: true
  mode: queued
  max: 10
