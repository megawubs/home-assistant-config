    to:
    - 'off'
    id: inactiviteit
    trigger: state
    for:
      hours: 0
      minutes: 1
      seconds: 0
  - type: opened
    device_id: f753d4bffa87a210ed5e67e6af2d28f0
    entity_id: 0464805fa473716b015ad1d67ae7e433
