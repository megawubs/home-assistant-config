- id: '1607111315472'
  alias: 'Verlichting: Badkamer'
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.activiteit_in_de_badkamer_nieuw
    to: 'on'
    id: Activiteit
    trigger: state
  - entity_id:
    - binary_sensor.beweging_in_de_badkamer
    to: 'on'
    id: Activiteit
    trigger: state
  - entity_id:
    - binary_sensor.beweging_overloop_motion
    to: 'on'
    id: 'Beweging overloop '
    trigger: state
  - entity_id:
    - binary_sensor.acitiviteit_in_de_badkamer
    to: 'off'
    for:
      hours: 0
      minutes: 10
      seconds: 0
    id: Inactiviteit
    trigger: state
  - entity_id:
    - binary_sensor.activiteit_op_de_overloop
    to: 'off'
    id: Geen Beweging overloop
    trigger: state
  conditions:
  - condition: state
    entity_id: binary_sensor.licht_intensiteit_in_de_woonkamer_onder_ingestelde_waarde
    state: 'on'
    enabled: false
  actions:
  - if:
    - condition: trigger
      id:
      - Activiteit
    then:
    - data: {}
      action: script.badkamer_aan
    - wait_for_trigger:
      - entity_id:
        - binary_sensor.acitiviteit_in_de_badkamer
        to: 'off'
        for:
          hours: 0
          minutes: 3
          seconds: 0
        trigger: state
      continue_on_timeout: false
      enabled: false
    - target:
        entity_id: light.badkamer_leds
      data: {}
      enabled: false
      action: light.turn_off
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - 'Beweging overloop '
    - condition: time
      after: '21:00:00'
      before: 06:00:00
    then:
    - data: {}
      action: script.badkamer_aan
  - if:
    - condition: trigger
      id:
      - Inactiviteit
    then:
    - target:
        entity_id: light.badkamer_leds
      data: {}
      action: light.turn_off
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - Geen Beweging overloop
      - condition: state
        entity_id: binary_sensor.badkamer_deur
        for:
          hours: 0
          minutes: 1
          seconds: 30
        state: 'off'
    then:
    - target:
        entity_id: light.badkamer_leds
      data: {}
      action: light.turn_off
  mode: restart
