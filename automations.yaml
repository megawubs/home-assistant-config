    id: vakantie_nee
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: vakantie_ja
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.vakantie_modus
        data: {}
      - action: notify.mobile_app_iphone_van_bram
        data:
          title: Vakantie modus geactiveerd
          message: Vakantie modus is aangezet. Geniet van jullie tijd weg!
    - conditions:
