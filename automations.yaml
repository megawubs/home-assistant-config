      - action: notify.mobile_app_iphone_van_bram
        data:
          title: Vakantie modus niet aangezet
          message: Oké, ik hou het huis op normale stand. Veel plezier!
- id: '1737381600001'
  alias: 'Airco Beneden: Manual Override Reset om 00:00'
  description: Reset de manual override voor de airco's beneden elke nacht om 00:00
  triggers:
  - trigger: time
    at: '00:00:00'
  conditions: []
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.airco_woonkamer_manual_override
    data: {}
  - action: notify.mobile_app_iphone_van_bram
    data:
      message: Airco beneden manual override is gereset - automatische bediening is weer actief
  mode: single
- id: '1737381600002'
  alias: 'Airco Beneden: Detecteer handmatige bediening'
  description: Activeert manual override wanneer een airco beneden via de fysieke remote wordt bediend (niet via HA UI)
  triggers:
  - trigger: state
    entity_id: climate.airco_woonkamer
    for:
      hours: 0
      minutes: 0
      seconds: 2
    id: woonkamer
  - trigger: state
    entity_id: climate.airco_keuken
    for:
      hours: 0
      minutes: 0
      seconds: 2
    id: keuken
  conditions:
  - condition: state
    entity_id: input_boolean.airco_woonkamer_manual_override
    state: 'off'
  - condition: template
    alias: "Wijziging niet via HA UI (geen user_id)"
    value_template: >-
      {{ trigger.to_state.context.user_id is none }}
  - condition: template
    alias: "Er was daadwerkelijk een wijziging"
    value_template: >-
      {% set old = trigger.from_state %}
      {% set new = trigger.to_state %}
      {{
        old.state != new.state or
        old.attributes.temperature != new.attributes.temperature or
        old.attributes.get('fan_mode') != new.attributes.get('fan_mode') or
        old.attributes.get('preset_mode') != new.attributes.get('preset_mode')
      }}
  - condition: template
    alias: "Niet recent door automation gewijzigd (60 sec window voor label met meerdere devices)"
    value_template: >-
      {% set last_auto = states('input_datetime.airco_woonkamer_laatste_automatische_wijziging') %}
      {% if last_auto in ['unknown', 'unavailable', 'none'] %}
        true
      {% else %}
        {{ (now().timestamp() - as_timestamp(last_auto)) > 60 }}
      {% endif %}
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.airco_woonkamer_manual_override
    data: {}
  - action: notify.mobile_app_iphone_van_bram
    data:
      message: >-
        Airco beneden manual override geactiveerd - handmatige bediening gedetecteerd
        ({{ 'woonkamer' if trigger.id == 'woonkamer' else 'keuken' }})
  mode: single
- id: 'airco_woonkamer_boost_modus_auto'
  alias: Airco Woonkamer Boost Modus Beheer
  description: 'Activeer boost bij grote temp delta, deactiveer na bereiken setpoint of timeout'
  triggers:
    # Automatisch activeren bij schema start met grote delta
    - trigger: state
      entity_id: schedule.airco_woonkamer
      from: 'off'
      to: 'on'
      id: auto_boost_aan
    # Ook activeren als delta groot wordt terwijl schema al aan staat
    - trigger: template
      value_template: >
        {{ (states('input_number.airco_woonkamer_drempelwaarde_verwarmen') | float -
            states('sensor.tstat_9d4027_current_temperature') | float) >= 2.5
           and is_state('binary_sensor.airco_woonkamer_mag_verwarmen', 'on')
           and is_state('schedule.airco_woonkamer', 'on') }}
      id: auto_boost_aan
      for:
        minutes: 2
    # Deactiveren wanneer setpoint bijna bereikt
    - trigger: template
      value_template: >
        {{ (states('input_number.airco_woonkamer_drempelwaarde_verwarmen') | float -
            states('sensor.tstat_9d4027_current_temperature') | float) <= 0.5
           and is_state('input_boolean.airco_woonkamer_boost_modus', 'on') }}
      id: boost_uit_bereikt
      for:
        minutes: 1
    # Timeout na 45 minuten
    - trigger: state
      entity_id: input_boolean.airco_woonkamer_boost_modus
      to: 'on'
      for:
        minutes: 45
      id: boost_timeout
    # Manuele activatie van boost modus
    - trigger: state
      entity_id: input_boolean.airco_woonkamer_boost_modus
      from: 'off'
      to: 'on'
      id: manual_boost_aan
  conditions:
    - condition: state
      entity_id: input_boolean.airco_woonkamer_manual_override
      state: 'off'
    - condition: state
      entity_id: binary_sensor.airco_woonkamer_mag_aan
      state: 'on'
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: auto_boost_aan
            - condition: state
              entity_id: input_boolean.airco_woonkamer_boost_modus
              state: 'off'
            - condition: template
              value_template: >
                {{ (states('input_number.airco_woonkamer_drempelwaarde_verwarmen') | float -
                    states('sensor.tstat_9d4027_current_temperature') | float) >= 2.5 }}
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.airco_woonkamer_boost_modus
            - action: notify.mobile_app_iphone_van_bram
              data:
                message: >
                  Boost modus geactiveerd - delta {{ (states('input_number.airco_woonkamer_drempelwaarde_verwarmen') | float -
                  states('sensor.tstat_9d4027_current_temperature') | float) | round(1) }}°C
        # Manuele boost activatie
        - conditions:
            - condition: trigger
              id: manual_boost_aan
          sequence:
            - action: notify.mobile_app_iphone_van_bram
              data:
                message: "Boost modus handmatig geactiveerd"
        - conditions:
            - condition: trigger
              id:
                - boost_uit_bereikt
                - boost_timeout
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.airco_woonkamer_boost_modus
            - action: notify.mobile_app_iphone_van_bram
              data:
                message: >
                  Boost modus uitgeschakeld -
                  {% if trigger.id == 'boost_timeout' %}timeout bereikt
                  {% else %}temperatuur bereikt{% endif %}
  mode: restart
- id: '1737667200000'
  alias: 'Verlichting: Automatische verlichting lang uit reminder'
  description: Stuurt elke 8 uur een herinnering als automatische verlichting uit staat
  triggers:
  - trigger: state
    entity_id: input_boolean.automatische_verlichting_woonkamer
    to: 'off'
    for:
      hours: 3
      minutes: 0
      seconds: 0
  conditions: []
  actions:
  - alias: Herhaal notificatie elke 8 uur zolang automatische verlichting uit staat
    repeat:
      while:
      - condition: state
        entity_id: input_boolean.automatische_verlichting_woonkamer
        state: 'off'
      sequence:
      - action: notify.mobile_app_iphone_van_bram
        data:
          title: "🤖 Automatische verlichting staat uit"
          message: "Automatische verlichting staat al {{ ((as_timestamp(now()) - as_timestamp(states.input_boolean.automatische_verlichting_woonkamer.last_changed)) / 3600) | round(0) }} uur uit. Weer aanzetten?"
          data:
            actions:
            - action: AUTO_VERLICHTING_AAN
              title: Ja, aanzetten
              icon: sfsymbols:lightbulb.max
            - action: AUTO_VERLICHTING_NEGEREN
              title: Laat uit
              icon: sfsymbols:hand.raised
      - wait_for_trigger:
        - trigger: event
          event_type: mobile_app_notification_action
          event_data:
            action: AUTO_VERLICHTING_AAN
        - trigger: event
          event_type: mobile_app_notification_action
          event_data:
            action: AUTO_VERLICHTING_NEGEREN
        - trigger: state
          entity_id: input_boolean.automatische_verlichting_woonkamer
          to: 'on'
        timeout:
          hours: 3
          minutes: 0
          seconds: 0
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: "{{ wait.trigger and wait.trigger.event.data.action == 'AUTO_VERLICHTING_AAN' }}"
        then:
        - action: input_boolean.turn_on
          entity_id: input_boolean.automatische_verlichting_woonkamer
        - action: notify.mobile_app_iphone_van_bram
          data:
            message: "Automatische verlichting is weer aan ✓"
        - stop: Automatische verlichting aangezet op verzoek
      - if:
        - condition: template
          value_template: "{{ wait.trigger and wait.trigger.event.data.action == 'AUTO_VERLICHTING_NEGEREN' }}"
        then:
        - stop: Gebruiker wil automatische verlichting uit laten
      - if:
        - condition: state
          entity_id: input_boolean.automatische_verlichting_woonkamer
          state: 'on'
        then:
        - stop: Automatische verlichting is al aan
  mode: restart
