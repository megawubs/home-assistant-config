    entity_id:
    - water_heater.boiler
    to: unavailable
  - trigger: state
    entity_id:
    - input_boolean.ariston_moet_uit
  - trigger: state
    entity_id:
    - input_boolean.ariston_moet_aan
  conditions: []
  actions:
  - if:
    - condition: state
      entity_id: water_heater.boiler
      state: unavailable
    then:
    - action: homeassistant.update_entity
      metadata: {}
      data:
        entity_id:
        - water_heater.boiler
    - wait_for_trigger:
      - trigger: state
        entity_id:
        - water_heater.boiler
        to:
        from: unavailable
      continue_on_timeout: false
      enabled: true
      timeout:
        hours: 0
        minutes: 0
        seconds: 50
        milliseconds: 0
  - if:
    - condition: state
      entity_id: binary_sensor.ariston_is_heating
      state: 'off'
    then:
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.ariston_power
    enabled: false
  - if:
    - condition: and
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.ariston_mag_aan_op_basis_van_tijd
          state: 'on'
        - condition: state
          entity_id: binary_sensor.ariston_mag_aan_op_basis_van_zonneoverschot
          state: 'on'
      - condition: or
        conditions:
        - condition: state
          entity_id: switch.ariston_power
          state: 'off'
        - condition: state
          entity_id: water_heater.boiler
          state: GREEN
    then:
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.ariston_power
    - action: water_heater.set_operation_mode
      metadata: {}
      data:
        operation_mode: BOOST
      target:
        entity_id: water_heater.boiler
    - action: water_heater.set_temperature
      metadata: {}
      data:
        temperature: 75
      target:
        device_id: de7b74355666694e40775f40a187191e
    - metadata: {}
      data:
        datetime: '{{now()+timedelta(hours=states("sensor.ariston_opgewarmd_in")|
          int )}}'
      target:
        entity_id: input_datetime.ariston_verwachte_eind_tijd
      action: input_datetime.set_datetime
  - if:
    - condition: and
      conditions:
      - condition: state
        entity_id: binary_sensor.ariston_mag_aan_op_basis_van_tijd
        state: 'off'
      - condition: state
        entity_id: binary_sensor.ariston_mag_aan_op_basis_van_zonneoverschot
        state: 'off'
      - condition: state
        entity_id: switch.ariston_power
        state: 'on'
    then:
    - metadata: {}
      data: {}
      target:
        entity_id: switch.ariston_power
      enabled: false
      action: switch.turn_off
    - metadata: {}
      data:
        operation_mode: GREEN
      target:
        entity_id: water_heater.boiler
      action: water_heater.set_operation_mode
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - Opgewarmd In
        enabled: true
      - condition: state
        entity_id: binary_sensor.ariston_mag_aan_op_basis_van_tijd
        state: 'off'
        enabled: false
    then:
    - metadata: {}
      data:
        datetime: '{% if states(''sensor.boiler_opwarmen'') | as_datetime > now()
          %}

          {{ (states(''sensor.boiler_opwarmen'') | as_datetime | as_local) + timedelta(hours=states("sensor.ariston_opgewarmd_in")|
          float )  }}

          {% else %}

          {{now()+timedelta(hours=states("sensor.ariston_opgewarmd_in")| float )}}

          {% endif %}'
      target:
        entity_id: input_datetime.ariston_verwachte_eind_tijd
      action: input_datetime.set_datetime
    enabled: false
  mode: restart
