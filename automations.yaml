- id: '1674910294791'
  alias: 'Klimaat: Zolder'
  description: ''
  trigger:
  - platform: state
    entity_id:
    - schedule.verwarming_zolder
    to: 'on'
    from: 'off'
    id: verwarmen
  - platform: state
    entity_id:
    - schedule.verwarming_zolder
    to: 'off'
    from: 'on'
    id: laag
  - platform: state
    entity_id:
    - binary_sensor.zolder_raam_openen
    id: zolder raam geopend
    to: 'on'
  - platform: state
    entity_id:
    - binary_sensor.zolder_raam_openen
    id: zolder raam gesloten
    to: 'off'
  condition:
  - condition: state
    entity_id: person.bram_wubs
    state: home
  action:
  - alias: Automatische verwarming Zolder uitzetten
    if:
    - condition: trigger
      id:
      - zolder raam geopend
    then:
    - service: input_boolean.turn_off
      data: {}
      target:
        entity_id: input_boolean.automatische_verwarming_zolder
  - alias: Automatische verwarming Zolder aanzetten
    if:
    - condition: trigger
      id:
      - zolder raam gesloten
    then:
    - service: input_boolean.turn_on
      data: {}
      target:
        entity_id: input_boolean.automatische_verwarming_zolder
  - alias: Verwarmen naar 16
    if:
    - condition: or
      conditions:
      - condition: trigger
        id: verwarmen
      - condition: trigger
        id:
        - zolder raam gesloten
    - condition: state
      entity_id: person.bram_wubs
      state: home
      alias: Bram is thuis
    - condition: state
      entity_id: input_boolean.thuiswerkdag
      state: 'on'
    - condition: state
      entity_id: input_boolean.automatische_verwarming_zolder
      state: 'on'
    - condition: state
      entity_id: schedule.verwarming_zolder
      state: 'on'
    then:
    - service: climate.turn_on
      data: {}
      target:
        entity_id: climate.kantoor_2
    - service: climate.set_temperature
      data:
        temperature: 16
      target:
        entity_id: climate.kantoor_2
    - service: notify.bram
      data:
        message: Kantoor ingesteld naar 16 graden
        data:
          actions:
          - action: KLIMAAT_ZOLDER_MOET_UIT
            title: Weer uit zetten?
            activationMode: background
    - wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: KLIMAAT_ZOLDER_MOET_UIT
      timeout:
        hours: 0
        minutes: 2
        seconds: 0
        milliseconds: 0
      continue_on_timeout: false
    - service: climate.turn_off
      data: {}
      target:
        entity_id: climate.kantoor_2
  - alias: Verwarming uit
    if:
    - condition: or
      conditions:
      - condition: trigger
        id:
        - zolder raam geopend
      - condition: and
        conditions:
        - condition: trigger
          id: laag
        alias: Als triggered door laag
    then:
    - service: climate.set_temperature
      data:
        temperature: 12
      target:
        entity_id: climate.kantoor_2
      enabled: false
    - service: climate.turn_off
      data: {}
      target:
        entity_id: climate.kantoor_2
    else: []
  mode: queued
  max: 10
