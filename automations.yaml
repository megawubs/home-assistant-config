    enabled: false
  - entity_id:
    - binary_sensor.beweging_in_de_hal_beweging
    from: 'off'
    to: 'on'
    id: activiteit
    trigger: state
    enabled: false
  - entity_id:
    - sensor.beweging_in_de_hal_batterij
    from: 'on'
    to: 'off'
    id: inactiviteit
    trigger: state
    enabled: false
  - entity_id:
    - binary_sensor.badkamer_deur
    to: 'on'
    id: activiteit
    trigger: state
    enabled: false
  - entity_id:
    - binary_sensor.beweging_overloop_motion
    from:
    to: 'on'
    id: activiteit
    trigger: state
    enabled: false
  - entity_id:
    - binary_sensor.activiteit_op_de_overloop
    to: 'on'
    id: activiteit
    trigger: state
  - entity_id:
    - binary_sensor.activiteit_op_de_overloop
    to: 'off'
    id: inactiviteit
    trigger: state
  conditions:
  - condition: numeric_state
    entity_id: sensor.aanwezigheid_overloop_licht
    below: 100
  actions:
  - if:
    - condition: and
