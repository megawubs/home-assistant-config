- id: 'unavailable_entities_daily_check'
  alias: 'Melding: Onbereikbare entiteiten (dagelijks)'
  description: 'Dagelijkse check om 10:00 voor onbereikbare entiteiten. Vervangt alle losse unavailable automations.'
  use_blueprint:
    path: gmlupatelli/unavailable_entities_notification.yaml
    input:
      time: '10:00:00'
      exclude:
        entity_id:
        - sensor.iphone_van_bram_battery_level
        - sensor.iphone_van_maninne_battery_level
        - sensor.ipad_van_maninne_battery_level
        - sensor.workhorse_internal_battery_level
        - sensor.power_block_battery_level
        - sensor.power_block_main_battery_level
        - sensor.plug_in_battery_laadpercentage
        - sensor.plug_in_battery_laadpercentage_2
      actions:
      - action: notify.mobile_app_iphone_van_bram
        data:
          title: "\U0001F6A8 Onbereikbare entiteiten"
          message: "De volgende entiteiten zijn niet beschikbaar: {{entities}}"
- id: '1607111315472'
  alias: 'Verlichting: Badkamer'
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.activiteit_in_de_badkamer_nieuw
    to: 'on'
    id: Activiteit
    trigger: state
  - entity_id:
    - binary_sensor.beweging_in_de_badkamer
    to: 'on'
    id: Activiteit
    trigger: state
  - entity_id:
    - binary_sensor.beweging_overloop_motion
    to: 'on'
    id: 'Beweging overloop '
    trigger: state
  - entity_id:
    - binary_sensor.acitiviteit_in_de_badkamer
    to: 'off'
    for:
      hours: 0
      minutes: 10
      seconds: 0
    id: Inactiviteit
    trigger: state
  - entity_id:
    - binary_sensor.activiteit_op_de_overloop
    to: 'off'
    id: Geen Beweging overloop
    trigger: state
  conditions:
  - condition: state
    entity_id: binary_sensor.licht_intensiteit_in_de_woonkamer_onder_ingestelde_waarde
    state: 'on'
    enabled: false
  actions:
  - if:
    - condition: trigger
      id:
      - Activiteit
    then:
    - data: {}
      action: script.badkamer_aan
    - wait_for_trigger:
      - entity_id:
        - binary_sensor.acitiviteit_in_de_badkamer
        to: 'off'
        for:
          hours: 0
          minutes: 3
          seconds: 0
        trigger: state
      continue_on_timeout: false
      enabled: false
    - target:
        entity_id: light.badkamer_leds
      data: {}
      enabled: false
      action: light.turn_off
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - 'Beweging overloop '
    - condition: time
      after: '21:00:00'
      before: 06:00:00
    then:
    - data: {}
      action: script.badkamer_aan
  - if:
    - condition: trigger
      id:
      - Inactiviteit
    then:
    - target:
        entity_id: light.badkamer_leds
      data: {}
      action: light.turn_off
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - Geen Beweging overloop
      - condition: state
        for:
          hours: 0
          minutes: 1
          seconds: 30
        state: 'off'
        entity_id: binary_sensor.activiteit_in_de_badkamer_nieuw
    then:
    - target:
        entity_id: light.badkamer_leds
      data: {}
      action: light.turn_off
  mode: restart
