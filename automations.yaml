- id: '1609198231431'
  alias: 'Verlichting: Bijkeuken'
  description: 'Lamp aan bij beweging, altijd uit bij geen beweging (ook als automatische verlichting uit staat)'
  triggers:
  - entity_id:
    - binary_sensor.activiteit_in_de_bijkeuken
    to: 'off'
    id: Geen beweging
    for:
      hours: 0
      minutes: 0
      seconds: 0
    trigger: state
  - entity_id:
    - binary_sensor.activiteit_in_de_bijkeuken
    to: 'on'
    id: Beweging
    trigger: state
  conditions: []
  actions:
  - if:
    - condition: trigger
      id: Beweging
    - condition: state
      entity_id: input_boolean.automatische_verlichting_woonkamer
      state: 'on'
    then:
    - action: switch.turn_on
      entity_id: switch.bijkeuken_lamp
  - if:
    - condition: trigger
      id: Geen beweging
    then:
    - action: switch.turn_off
      entity_id: switch.bijkeuken_lamp
  mode: restart
- id: '1609198735337'
  alias: 'Verlichting: Keuken'
  description: ''
  triggers:
  - type: motion
    device_id: 0d1c3d4b1191e77a2e473f5ab265a8af
    entity_id: binary_sensor.beweging_in_de_keuken
    domain: binary_sensor
    id: beweging gedetecteerd
    enabled: false
    trigger: device
  - type: no_motion
    device_id: 0d1c3d4b1191e77a2e473f5ab265a8af
    entity_id: binary_sensor.beweging_in_de_keuken
    domain: binary_sensor
    id: geen beweging gedetecteerd
    for:
      hours: 0
      minutes: 5
      seconds: 0
    enabled: false
    trigger: device
  - entity_id:
    - binary_sensor.activiteit_in_de_keuken
    from:
    to: 'on'
    id: beweging gedetecteerd
    trigger: state
  - entity_id:
    - binary_sensor.activiteit_in_de_keuken
    from:
    to: 'off'
    id: geen beweging gedetecteerd
    trigger: state
  conditions:
  - condition: and
    conditions:
    - condition: template
      value_template: '{{ states(''sensor.verlichtingssterkte_woonkamer'' ) | float
        <= states(''input_number.minimale_verlichtingssterkte_woonkamer'') | float
        }}'
    - condition: state
      entity_id: input_boolean.automatische_verlichting_woonkamer
      state: 'on'
  actions:
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id: beweging gedetecteerd
    then:
    - data:
        brightness_pct: 60
      target:
        entity_id: light.keuken
      action: light.turn_on
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id: geen beweging gedetecteerd
    then:
    - data: {}
      target:
        entity_id:
        - light.keuken
      action: light.turn_off
  mode: single
