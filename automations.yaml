- id: '1759521136361'
  alias: Boiler - Compleet Cyclus Management
  description: Herijkt de opwarmduur, start en stopt de boiler op het optimale moment,
    zelfs als hij offline was.
  triggers:
  - at:
    - '10:00:00'
    - '11:00:00'
    - '12:00:00'
    - '13:00:00'
    id: herijken
    trigger: time
  - entity_id: binary_sensor.ariston_mag_aan_op_basis_van_tijd
    id: cyclus_controle
    trigger: state
    to: 'on'
  - entity_id: water_heater.boiler
    from: unavailable
    id: boiler_online
    trigger: state
  - entity_id: input_boolean.vakantie_modus
    to: 'on'
    id: vakantie_aan
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: herijken
      - condition: state
        entity_id: input_boolean.ariston_verwarmingscyclus_actief
        state: 'off'
      sequence:
      - target:
          entity_id: input_number.ariston_vastgezette_opwarmduur
        data:
          value: '{{ states("sensor.ariston_opgewarmd_in") | float(0) }}'
        action: input_number.set_value
    - conditions:
      - condition: trigger
        id: cyclus_controle
      - condition: state
        entity_id: binary_sensor.ariston_mag_aan_op_basis_van_tijd
        state: 'on'
      - condition: state
        entity_id: input_boolean.ariston_verwarmingscyclus_actief
        state: 'off'
      - condition: state
        entity_id: input_boolean.vakantie_modus
        state: 'off'
      sequence:
      - target:
          entity_id: input_boolean.boiler_verwarmingscyclus_actief
        action: input_boolean.turn_on
      - target:
          entity_id: switch.ariston_power
        action: switch.turn_on
      - data:
          operation_mode: BOOST
        target:
          entity_id: water_heater.boiler
        action: water_heater.set_operation_mode
    - conditions:
      - condition: trigger
        id: cyclus_controle
      - condition: state
        entity_id: binary_sensor.ariston_mag_aan_op_basis_van_tijd
        state: 'off'
      - condition: state
        entity_id: input_boolean.ariston_verwarmingscyclus_actief
        state: 'on'
      sequence:
      - data:
          operation_mode: GREEN
        target:
          entity_id: water_heater.boiler
        action: water_heater.set_operation_mode
      - target:
          entity_id: switch.ariston_power
        action: switch.turn_off
      - target:
          entity_id: input_boolean.boiler_verwarmingscyclus_actief
        action: input_boolean.turn_off
      - target:
          entity_id: input_number.vastgezette_opwarmduur
        data:
          value: 0
        action: input_number.set_value
    - conditions:
      - condition: trigger
        id: boiler_online
      - condition: state
        entity_id: input_boolean.ariston_verwarmingscyclus_actief
        state: 'on'
      - condition: state
        entity_id: input_boolean.vakantie_modus
        state: 'off'
      sequence:
      - target:
          entity_id: switch.ariston_power
        action: switch.turn_on
        data: {}
      - data:
          operation_mode: BOOST
        target:
          entity_id: water_heater.boiler
        action: water_heater.set_operation_mode
    - conditions:
      - condition: trigger
        id: vakantie_aan
      sequence:
      - action: water_heater.set_operation_mode
        target:
          entity_id: water_heater.boiler
        data:
          operation_mode: GREEN
      - if:
        - condition: state
          entity_id: input_boolean.boiler_verwarmingscyclus_actief
          state: 'on'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.boiler_verwarmingscyclus_actief
          data: {}
  mode: restart
- id: '1759527385163'
  alias: Wasmachine en Droger - Slim Plannen en Starten
  description: Plant en start de wasmachine of droger op het goedkoopste moment in
    de nacht.
  triggers:
  - trigger: state
    entity_id:
    - sensor.droger_bedrijfsstatus
    to: Finished
    id: Droger Finished
  - trigger: state
    entity_id:
    - sensor.droger_bedrijfsstatus
    to: run
    id: Droger Started
    from: delayedstart
  - trigger: state
    entity_id:
    - sensor.wasmachine_bedrijfsstatus
    from: Run
    to: Finished
    id: Wasmachine Finished
  - trigger: state
    entity_id:
    - sensor.wasmachine_bedrijfsstatus
    from: delayedstart
    to: run
    id: Wasmachine Started
  - trigger: state
    entity_id:
    - select.droger_geselecteerd_programma
    id: droger_klaar
    for:
      hours: 0
      minutes: 0
      seconds: 7
  - trigger: state
    entity_id:
    - select.wasmachine_geselecteerd_programma
    id: wasmachine_klaar
    for:
      hours: 0
      minutes: 0
      seconds: 7
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - wasmachine_klaar
      sequence:
      - variables:
          duration_hours: '{{ states(''sensor.wasmachine_estimated_total_program_time'')
            | float(3.5) }}

            '
          start_time: "{% from 'cheapest_energy_hours.jinja' import cheapest_energy_hours
            %}   {% set search_start = now() %} {% set search_end = today_at('07:00')
            + timedelta(days=1) %} {{ cheapest_energy_hours(\n    sensor='sensor.current_tariff',\n
            \   time_key='datetime',\n    hours=duration_hours,\n    start=search_start,\n
            \   end=search_end,\n    include_tomorrow=true\n  )\n}}\n"
          end_time: '{{ (start_time | as_datetime) + timedelta(hours=duration_hours)
            }}'
          hours: '{{ (end_time | as_datetime - now()).days * 24 + (end_time | as_datetime
            - now()).seconds // 3600 }}'
          minutes: '{{ ((end_time | as_datetime - now()).seconds % 3600) // 60 }}'
      - action: homeconnect_ws.start_program
        metadata: {}
        data:
          finish_in:
            hours: '{{ hours }}'
            minutes: '{{ minutes }}'
          device_id: 805a0e4a4b9ae3127127eab96b31ac4d
      - data:
          message: De wasmachine is over ~{{ hours }} uur klaar!
        action: notify.mobile_app_iphone_van_bram
    - conditions:
      - condition: trigger
        id:
        - droger_klaar
      sequence:
      - variables:
          duration_hours: '{{ states(''sensor.droger_estimated_total_program_time'')
            | float(3.5) }}

            '
          start_time: "{% from 'cheapest_energy_hours.jinja' import cheapest_energy_hours
            %}   {% set search_start = now() %} {% set search_end = today_at('07:00')
            + timedelta(days=1) %} {{ cheapest_energy_hours(\n    sensor='sensor.current_tariff',\n
            \   time_key='datetime',\n    hours=duration_hours,\n    start=search_start,\n
            \   end=search_end,\n    include_tomorrow=true\n  )\n}}\n"
          end_time: '{{ (start_time | as_datetime) + timedelta(hours=duration_hours)
            }}'
          hours: '{{ (end_time | as_datetime - now()).days * 24 + (end_time | as_datetime
            - now()).seconds // 3600 }}'
          minutes: '{{ ((end_time | as_datetime - now()).seconds % 3600) // 60 }}'
      - action: homeconnect_ws.start_program
        metadata: {}
        data:
          finish_in:
            hours: '{{ hours }}'
            minutes: '{{ minutes }}'
          device_id: 2b5e9c6d6b0cdc54d51e2e72859662d7
      - data:
          message: De droger is over ~{{ hours }} uur klaar!
        action: notify.mobile_app_iphone_van_bram
    - conditions:
      - condition: trigger
        id:
        - Droger Finished
        - Wasmachine Finished
      sequence:
      - variables:
          appliance_name: '{{ ''wasmachine'' if trigger.id == ''Wasmachine Finished''
            else ''droger'' }}'
          appliance_program_scheduled: input_boolean.{{ appliance_name }}_programma_ingepland
      - data:
          message: De {{appliance_name}} is klaar!
        action: notify.mobile_app_iphone_van_bram
    - conditions:
      - condition: trigger
        id:
        - Droger Started
        - Wasmachine Started
      sequence:
      - variables:
          appliance_name: '{{ ''wasmachine'' if trigger.id == ''Wasmachine Started''
            else ''droger'' }}'
          appliance_program_scheduled: input_boolean.{{ appliance_name }}_programma_ingepland
      - data:
          message: De {{appliance_name}} is gestart!
        action: notify.mobile_app_iphone_van_bram
  mode: parallel
