      - condition: or
        conditions:
        - condition: time
          before: 05:00:00
        - condition: time
          after: 07:00:00
    then:
    - target:
        entity_id:
        - light.overloop_licht
      data:
        brightness_pct: 1
      action: light.turn_on
  - if:
    - condition: and
