- id: '1609196365224'
  alias: 'Verlichting: Woonkamer'
  description: ''
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.activiteit_in_de_woonkamer
    to: 'on'
    from: 'off'
    id: beweging gedetecteerd
  - platform: sun
    event: sunset
    offset: -00:45:00
    id: zon gaat onder
    alias: Zon gaat onder
    enabled: false
  - platform: sun
    event: sunrise
    offset: +01:30:00
    id: zon komt op
    alias: Zon komt op
  - platform: state
    entity_id:
    - input_boolean.modus_slaap
    from: 'off'
    to: 'on'
    id: Slaap modus gaat aan
  - platform: state
    entity_id:
    - binary_sensor.activiteit_in_de_woonkamer
    to: 'off'
    from: 'on'
    id: Inactiviteit gedetecteerd
  - platform: state
    entity_id:
    - binary_sensor.licht_intensiteit_in_de_woonkamer_onder_ingestelde_waarde
    from: 'off'
    to: 'on'
    id: Het wordt donker
  condition:
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.automatische_verlichting_woonkamer
      state: 'on'
  action:
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id: beweging gedetecteerd
        enabled: true
      - condition: state
        entity_id: light.woonkamer
        state: 'off'
        enabled: true
      - condition: sun
        after: sunset
        after_offset: +00:45:00
        enabled: false
      - condition: state
        entity_id: input_boolean.modus_slaap
        state: 'off'
      - condition: state
        entity_id: binary_sensor.licht_intensiteit_in_de_woonkamer_onder_ingestelde_waarde
        state: 'on'
      alias: Getriggerd bij beweging en woonkamer is uit en de zon gaat bijna onder
        en slaap modus is uit
    then:
    - service: script.woonkamer_aan
      data: {}
    - service: notify.bram
      data:
        message: Woonkamer aan omdat er beweging was en het is donker genoeg
    alias: Woonkamer aan als er beweging was en wanneer het donker is als we wakker
      zijn
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id: zon gaat onder
      - condition: state
        entity_id: binary_sensor.activiteit_in_de_woonkamer_voor_afgelopen_10_minuten
        state: 'on'
      alias: Zon gaat onder en er was beweging
    then:
    - service: script.woonkamer_aan
      data: {}
    - service: notify.bram
      data:
        message: Woonkamer aan omdat de zon onder gaat en er activiteit was in de
          woonkamer
    alias: Woonkamer aan als zon onder gaat en er beweging was
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id: zon komt op
      - condition: state
        entity_id: light.woonkamer
        state: 'on'
      alias: Woonkamer uit als de zon op komt
    then:
    - service: script.woonkamer_uit
      data: {}
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id: beweging gedetecteerd
      - condition: state
        entity_id: input_boolean.modus_slaap
        state: 'on'
    then:
    - service: light.turn_on
      data:
        brightness_pct: 30
        transition: 9
      target:
        entity_id:
        - light.eettafel
        - light.texas_instruments_cc2531_z_stack_home_1_2_build_20211115_keuken_zha_group_0x0003
        - light.box_links
        - light.box_rechtss
    alias: Nacht modus wanneer beweging in de woonkamer in de nacht. Automatisch uit
      gaan wanneer er geen beweging meer is
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id: Slaap modus gaat aan
      - condition: state
        entity_id: light.woonkamer
        state: 'on'
      - condition: state
        entity_id: binary_sensor.activiteit_in_de_woonkamer_voor_afgelopen_half_uur
        state: 'on'
    then:
    - wait_for_trigger:
      - platform: state
        entity_id:
        - binary_sensor.activiteit_in_de_woonkamer_voor_afgelopen_half_uur
        from: 'on'
        to: 'off'
      continue_on_timeout: false
    - service: notify.bram
      data:
        message: Woonkamer uit gedaan!
    - service: script.woonkamer_uit
      data: {}
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id: Inactiviteit gedetecteerd
      - condition: state
        entity_id: light.woonkamer
        state: 'on'
      alias: Woonkamer uit als lampen aan zijn en er geen activteit is
    then:
    - service: media_player.media_stop
      data: {}
      target:
        area_id: 3baf8165348041e1b29208776b5bf03d
        entity_id: media_player.woonkamer
      enabled: false
    - service: script.woonkamer_uit
      data: {}
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id: Het wordt donker
      - condition: state
        entity_id: binary_sensor.activiteit_in_de_woonkamer
        state: 'on'
    then:
    - service: script.woonkamer_aan
      data: {}
  mode: restart
