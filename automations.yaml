    - type: turn_off
      device_id: 6a8ea11bac3c28d2ab6d3085b41f1745
      entity_id: d1b071a27d769061708eed2a10e73c69
      domain: switch
  - alias: Handmatig Nul op de meter
    if:
    - condition: trigger
      id:
      - handmatig_nul_op_meter
    then:
    - action: rest_command.mode_zero
      metadata: {}
      data: {}
    - type: turn_off
      device_id: 6a8ea11bac3c28d2ab6d3085b41f1745
      entity_id: d1b071a27d769061708eed2a10e73c69
      domain: switch
  - alias: Handmatig Laden
    if:
    - condition: trigger
      id:
      - handmatig_laden
    then:
    - action: rest_command.mode_to_full
      metadata: {}
      data: {}
    - action: switch.turn_on
      metadata: {}
      target:
        entity_id: switch.power_block_socket
      data: {}
    - action: number.set_value
      metadata: {}
      target:
        entity_id: number.power_block_potential_charge
      data:
        value: '660'
  - alias: Automatisch na laden of auto stopt
    if:
    - condition: trigger
      id:
      - Nul op de meter
      - Laden_einde
    then:
    - alias: Niet ontladen als auto laadt (voorkomt accu -> auto)
      if:
      - condition: numeric_state
        entity_id: sensor.kwh_meter_id_5_vermogen
        above: 1
      then:
      - stop: Auto laadt, batterij niet ontladen
    - alias: Als stroom goedkoop is, wacht met ontladen (standby)
      if:
      - condition: state
        entity_id: binary_sensor.stroomtarief_onder_gemiddelde
        state: 'on'
      then:
      - action: rest_command.mode_standby
        metadata: {}
        data: {}
      - type: turn_off
        device_id: 6a8ea11bac3c28d2ab6d3085b41f1745
        entity_id: d1b071a27d769061708eed2a10e73c69
        domain: switch
      - stop: Stroom nog goedkoop, wacht met ontladen
    - action: rest_command.mode_zero
      metadata: {}
      data: {}
    - type: turn_off
      device_id: 6a8ea11bac3c28d2ab6d3085b41f1745
      entity_id: d1b071a27d769061708eed2a10e73c69
      domain: switch
  - alias: Ontladen bij dure stroom
    if:
    - condition: trigger
      id:
      - Stroom_duur
    then:
    - alias: Alleen ontladen als auto niet laadt (voorkomt accu -> auto)
      if:
      - condition: numeric_state
        entity_id: sensor.kwh_meter_id_5_vermogen
        above: 1
      then:
      - stop: Auto laadt, batterij niet naar nul op de meter
    - action: rest_command.mode_zero
      metadata: {}
      data: {}
    - type: turn_off
      device_id: 6a8ea11bac3c28d2ab6d3085b41f1745
      entity_id: d1b071a27d769061708eed2a10e73c69
      domain: switch
  - alias: Automatisch Laden (gepland moment)
    if:
    - condition: trigger
      id:
      - Laden_gepland
    then:
    - action: rest_command.mode_to_full
      metadata: {}
      data: {}
    - action: switch.turn_on
      metadata: {}
      target:
        entity_id: switch.power_block_socket
      data: {}
    - action: number.set_value
      metadata: {}
      target:
        entity_id: number.power_block_potential_charge
      data:
        value: '660'
  - alias: Auto start met laden (stop ontladen, voorkom accu -> auto)
    if:
    - condition: trigger
      id:
      - auto_laadt
    then:
    - alias: Als batterij al aan het laden is, laat hem doorgaan
      if:
      - condition: state
        entity_id: sensor.battery_group_mode
        state: to_full
      then:
      - stop: Batterij is al aan het laden, geen actie nodig
    - alias: Als batterij aan het ontladen is, zet naar standby (voorkom accu -> auto)
      if:
      - condition: state
        entity_id: sensor.battery_group_mode
        state: zero
      then:
      - action: rest_command.mode_standby
        metadata: {}
        data: {}
      - type: turn_off
        device_id: 6a8ea11bac3c28d2ab6d3085b41f1745
        entity_id: d1b071a27d769061708eed2a10e73c69
        domain: switch
  mode: single
