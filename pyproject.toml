[project]
name = "home-assistant-config"
version = "0.1.0"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
test = [
    "pytest-homeassistant-custom-component==0.13.373",
    "pytest-bdd==9.0.0",
]

[tool.uv]
package = false
default-groups = ["test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
