sensor:
  - name: "EV Laadmodus"
    state_topic: "evcc/loadpoints/1/mode"

  - name: "EV Laadvermogen"
    state_topic: "evcc/loadpoints/1/chargePower"
    unit_of_measurement: "W"
    device_class: power

  - name: "EV Geladen energie"
    state_topic: "evcc/loadpoints/1/chargedEnergy"
    unit_of_measurement: "kWh"
    device_class: energy

binary_sensor:
  - name: "EV Aangesloten"
    state_topic: "evcc/loadpoints/1/connected"
    payload_on: "true"
    payload_off: "false"

  - name: "EVCC Plan Actief"
    state_topic: "evcc/loadpoints/1/planActive"
    payload_on: "true"
    payload_off: "false"
