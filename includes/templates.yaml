- trigger:
    - alias: Triggers on home assistant startup
      platform: homeassistant
      event: start
    - platform: state
      entity_id: sensor.ariston_opgewarmd_in
    - platform: state
      entity_id: sensor.current_tariff
  sensor:
    - unique_id: 0F824D26-3489-45C7-83CD-2E831B3643E8
      name: Boiler opwarmen
      device_class: timestamp
      state: >
        {%- set sensor = 'sensor.current_tariff' -%}
        {% from 'cheapest_energy_hours.jinja' import cheapest_energy_hours %}
        {% set hours = states('sensor.ariston_opgewarmd_in') %}
        {% set start = "00:00" %}
        {% set end = "05:00" %}
        
        {% if now() > today_at("05:00") and now() < today_at("17:00") %}
        {% set start="10:00" %}
        {% set end="17:00" %}
        {% elif now() > today_at("17:00") and now() < today_at('21:30') %}
        {% set start="18:00" %}
        {% set end="21:30" %}
        {% endif %}
        
        {% set include_tomorrow = now() > today_at("21:30") %}
        {% if include_tomorrow %}
        {% set start = now() %}
        {% endif %}
        
        {{ cheapest_energy_hours(sensor=sensor, time_key='datetime', hours=hours, start=start, end=end, include_tomorrow=include_tomorrow) }}
        