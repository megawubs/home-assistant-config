- trigger:
    - alias: Triggers every hour
      platform: time_pattern
      hours: "/1"
    - alias: Triggers on home assistant startup
      platform: homeassistant
      event: start
  action:
    - alias: Collects the price information and stores this in a response variable
      action: energyzero.get_energy_prices # replace with the service call for your integration
      data:
        incl_vat: false
        config_entry: 01JGGZTXR5HD7DBK23BXAN38CM
        start: "{{ today_at() - timedelta(days=1) }}"
        end: "{{ today_at() + timedelta(days=2) }}"
      response_variable: prices
  sensor:
    - unique_id: 79c470d8-4ccd-4f44-b3a2-e3d59d5dda8a
      name: Energy Zero prices
      state: "{{ prices.prices | selectattr('timestamp', '<=', utcnow().strftime('%Y-%m-%d %H:%M:%S+00:00')) | map(attribute='price') | list | last }}"
      attributes:
        prices: "{{ prices.prices }}"
- trigger:
    - alias: Triggers on home assistant startup
      platform: homeassistant
      event: start
    - platform: time
      at:
        - "14:00"
        - "15:00"
        - "19:30"
        - "20:30"
        - "21:30"
- trigger:
    - alias: Triggers on home assistant startup
      platform: homeassistant
      event: start
    - platform: state
      entity_id: sensor.ariston_opgewarmd_in
    - platform: state
      entity_id: sensor.current_tariff
  sensor:
    - unique_id: 0F824D26-3489-45C7-83CD-2E831B3643E8
      name: Boiler opwarmen
      device_class: timestamp
      state: >
        {%- set sensor = 'sensor.current_tariff' -%}
        {% from 'cheapest_energy_hours.jinja' import cheapest_energy_hours %}
        {% set hours = states('sensor.ariston_opgewarmd_in') %}
        {% set start = "00:00" %}
        {% set end = "05:00" %}
        
        {% if now() > today_at("05:00") and now() < today_at("17:00") %}
        {% set start="10:00" %}
        {% set end="17:00" %}
        {% elif now() > today_at("17:00") and now() < today_at('21:30') %}
        {% set start="18:00" %}
        {% set end="21:30" %}
        {% endif %}
        
        {% set include_tomorrow = now() > today_at("21:30") %}
        {% if include_tomorrow %}
        {% set start = now() %}
        {% endif %}
        
        {{ cheapest_energy_hours(sensor=sensor, time_key='datetime', hours=hours, start=start, end=end, include_tomorrow=include_tomorrow) }}
        