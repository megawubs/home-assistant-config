- trigger:
    - alias: Triggers on home assistant startup
      platform: homeassistant
      event: start
    - platform: time
      at: "13:10"
  sensor:
    - unique_id: 0F824D26-3489-45C7-83CD-2E831B3643E8
      name: Boiler opwarmen
      device_class: timestamp
      state: >
        {%- set sensor = 'sensor.current_tariff' -%}
        {% from 'cheapest_energy_hours.jinja' import cheapest_energy_hours %}
        
        {# Gebruik de VASTGEZETTE waarde, niet de live sensor #}
        {% set hours = states('input_number.ariston_vastgezette_opwarmduur') %}
        {% set search_start = today_at("12:00") %}
        {% set search_end = today_at("17:00") %}
        {% set include_tomorrow = false %}

        {# Als het nu al voorbij de eindtijd van vandaag is, zoek dan vanaf morgen. #}
        {% if now() >= search_end %}
          {% set search_start = today_at("12:00") + timedelta(days=1) %}
          {% set search_end = today_at("17:00") + timedelta(days=1) %}
          {% set include_tomorrow = true %}
        {% endif %}
        
        {# Alleen berekenen als de duur groter is dan 0 #}
        {% if hours | float(0) > 0 %}
        {{ cheapest_energy_hours(
           sensor=sensor,
           time_key='datetime',
           hours=hours,
           start=search_start,
           end=search_end,
           include_tomorrow=include_tomorrow
           )
        }}
        {% else %}
        {# Geef een 'none' waarde terug als er niets te plannen valt #}
          {{ None }}
        {% endif %}

    - unique_id: gemiddeld_stroomtarief_vandaag
      name: "Gemiddeld Stroomtarief Vandaag"
      unit_of_measurement: "€/kWh"
      device_class: monetary
      state: >
        {% set current_tariff = state_attr('sensor.current_tariff', 'forecast') %}
        {% if current_tariff %}
          {% set today_start = now().replace(hour=0, minute=0, second=0, microsecond=0) %}
          {% set today_end = today_start + timedelta(days=1) %}
          {% set today_prices = current_tariff | selectattr('datetime', 'defined')
             | map(attribute='datetime')
             | map('as_datetime')
             | select('>=', today_start)
             | select('<', today_end)
             | list %}
          {% set prices = [] %}
          {% for item in current_tariff %}
            {% if item.datetime is defined %}
              {% set dt = item.datetime | as_datetime %}
              {% if dt >= today_start and dt < today_end and item.electricity_price is defined %}
                {% set prices = prices + [item.electricity_price / 10000000] %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% if prices | length > 0 %}
            {{ (prices | sum / prices | length) | round(4) }}
          {% else %}
            {{ states('sensor.current_tariff') | float(0.25) }}
          {% endif %}
        {% else %}
          {{ states('sensor.current_tariff') | float(0.25) }}
        {% endif %}
      icon: mdi:chart-line

    - unique_id: stroomtarief_verschil_met_gemiddelde
      name: "Stroomtarief Verschil met Gemiddelde"
      unit_of_measurement: "%"
      state: >
        {% set current = states('sensor.current_tariff') | float(0) %}
        {% set average = states('sensor.gemiddeld_stroomtarief_vandaag') | float(0) %}
        {% if average > 0 %}
          {{ (((current - average) / average) * 100) | round(1) }}
        {% else %}
          0
        {% endif %}
      icon: mdi:percent

- binary_sensor:
    - name: Woonkamer Daglicht
      unique_id: woonkamer_daglicht
      delay_off: "00:05:00"
      state: >
        {{ states('sensor.lichtintensiteit_benedenverdieping') | int >= 300 }}

    - name: Woonkamer Donker
      unique_id: woonkamer_dark
      delay_off: "00:05:00"
      state: >
        {{ states('sensor.lichtintensiteit_benedenverdieping') | int <= 10 }}
    
    - name: Luchtvochtigheid boven instestelde waarde in de badkamer
      unique_id: luchtvochtigheid_boven_ingestelde_waarde_in_de_badkamerk
      state: >
        {{ states('sensor.badkamer_multisensor_luchtvochtigheid')|float >= states('input_number.maximale_luchtvochtigheid_douche')|float }}

    - name: Activiteit ergens in huis
      unique_id: activiteit_ergens_in_huis
      state: >
        {{ is_state("binary_sensor.activiteit_in_de_badkamer", "on")
            or is_state("binary_sensor.activiteit_in_de_bijkeuken", "on")
            or is_state("binary_sensor.activiteit_bij_de_trap", "on")
            or is_state("binary_sensor.activiteit_bij_de_voordeur", "on")
            or is_state("binary_sensor.activiteit_op_de_overloop", "on")
            or is_state("binary_sensor.beweging_op_zolder", "on")
            or is_state("binary_sensor.activiteit_in_de_woonkamer", "on")
        }}

    - unique_id: activiteit_in_huis_voor_het_afgelopen_uur
      name: Activiteit in huis afgelopen uur
      state: >
        {{ is_state("binary_sensor.activiteit_ergens_in_huis", "on") }}
      delay_off: "01:00:00"

    - unique_id: activiteit_op_zolder_voor_afgelopen_6_minuten
      name: Activiteit op zolder voor afgelopen 6 minuten
      state: >
        {{ is_state("binary_sensor.beweging_op_zolder", "on")}}
      delay_off: 00:06:00

    - unique_id: iemand_thuis_voor_het_afgelopen_uur
      name: Iemand thuis voor het afgelopen uur
      state: >
        {{ is_state("binary_sensor.activiteit_in_huis_voor_het_afgelopen_uur", "on")
            or is_state("group.bewoners", "home") }}

    - unique_id: niemand_thuis
      name: Niemand is thuis
      state: >
        {{ not is_state("person.bram_wubs", "home")
            and not is_state("person.maninne_wubs", "home") }}

    - unique_id: bram_slaapt
      name: Bram slaapt
      state: >
        {{
          is_state('input_text.focus_bram', 'Slaap') 
        }}

    # temperatuur_woonkamer_is_(boven|onder)_drempel_waarden staan als
    # trigger-based binary_sensors met hysterese verderop in dit bestand.

    - unique_id: airco_woonkamer_mag_afkoelen
      name: "Airco woonkamer mag afkoelen"
      state: >
        {{
            ( 
              is_state('input_boolean.airco_woonkamer_moet_afkoelen', 'on') and 
              is_state('input_boolean.airco_woonkamer_moet_verwarmen', 'off') 
            ) 
            or
            (
              is_state('input_boolean.airco_woonkamer_moet_verwarmen', 'off') and
              is_state('binary_sensor.temperatuur_woonkamer_is_boven_drempel_waarden', 'on') and
              is_state('binary_sensor.temperatuur_woonkamer_is_onder_drempel_waarden_verwarmen', 'off') and
              is_state('binary_sensor.airco_woonkamer_mag_aan', 'on')
            )
        }}

    - unique_id: airco_woonkamer_mag_verwarmen
      name: "Airco woonkamer mag verwarmen"
      state: >
        {{
          ( 
            is_state('input_boolean.airco_woonkamer_moet_verwarmen', 'on') and 
            is_state('input_boolean.airco_woonkamer_moet_afkoelen', 'off') 
          ) 
          or 
          (
            is_state('input_boolean.airco_woonkamer_moet_afkoelen', 'off')  and
            is_state('binary_sensor.temperatuur_woonkamer_is_boven_drempel_waarden', 'off') and
            is_state('binary_sensor.temperatuur_woonkamer_is_onder_drempel_waarden_verwarmen', 'on') and
            is_state('binary_sensor.airco_woonkamer_mag_aan', 'on')
          )
        }}

    - unique_id: airco_woonkamer_mag_ventileren
      name: "Airco woonkamer mag ventileren"
      state: >
        {{
          is_state('input_boolean.airco_woonkamer_moet_verwarmen', 'off') and
          is_state('input_boolean.airco_woonkamer_moet_afkoelen', 'off') and
          is_state('binary_sensor.temperatuur_woonkamer_is_boven_drempel_waarden', 'off') and
          is_state('binary_sensor.temperatuur_woonkamer_is_onder_drempel_waarden_verwarmen', 'off') and
          is_state('binary_sensor.airco_woonkamer_mag_aan', 'on') and
          is_state('input_boolean.vakantie_modus', 'off') and
          states('sensor.airco_woonkamer_outdoor') | float(0) > 15
        }}

    - unique_id: airco_woonkamer_mag_aan
      name: "Airco woonkamer mag aan"
      state: >
        {{
          is_state('input_boolean.airco_woonkamer_moet_uit', 'off') and
          (
            (is_state('input_boolean.modus_gast', 'on') or is_state('input_boolean.airco_woonkamer_moet_aan', 'on'))
            or (
              (
                is_state('group.bewoners', 'home')
                or expand('group.bewoners') | selectattr('state', 'eq', 'Ommen') | list | count > 0
                or (is_state('input_boolean.vakantie_modus', 'on') and states('sensor.airco_woonkamer_outdoor') | float(99) < 5)
              )
              and is_state('binary_sensor.open_verbinding_naar_buiten', 'off')
              and is_state('schedule.airco_woonkamer', 'on')
            )
          )
         }}

    - unique_id: open_verbinding_naar_buiten
      name: "Open verbinding naar buiten"
      state: >
        {{
          is_state('binary_sensor.ramen_woonkamer', 'on')
          or ( is_state('binary_sensor.deur_hal_openen', 'on') and is_state('binary_sensor.voordeur', 'on'))
          or (is_state('binary_sensor.achterdeur_openen', 'on') and is_state('binary_sensor.keuken_deur_openen', 'on'))
        }}
      delay_on: 00:00:10

    - unique_id: airco_zolder_mag_afkoelen
      name: "Airco zolder mag afkoelen"
      state: >
        {{
          is_state('binary_sensor.temperatuur_zolder_is_boven_drempel_waarden', 'on')
          and is_state('binary_sensor.temperatuur_zolder_is_onder_drempel_waarden_verwarmen', 'off')
          and is_state('binary_sensor.airco_zolder_mag_aan', 'on')
        }}

    - unique_id: airco_zolder_mag_verwarmen
      name: "Airco zolder mag verwarmen"
      state: >
        {{
           is_state('binary_sensor.airco_zolder_mag_aan', 'on')
        }}

    - unique_id: airco_zolder_mag_ventileren
      name: "Airco zolder mag ventileren"
      state: >
        {{
          is_state('binary_sensor.arco_woonkamer_mag_verwarmen', 'on')
          and is_state('binary_sensor.airco_zolder_mag_aan', 'on')
          and states('sensor.airco_woonkamer_outdoor') | float(0) > 15
        }}

    - unique_id: airco_zolder_mag_aan
      name: "Airco zolder mag aan"
      state: >
        {{
            is_state('input_boolean.thuiswerkdag', 'on') and
            is_state('schedule.verwarming_zolder', 'on') and
            is_state('binary_sensor.open_verbinding_naar_buiten_zolder', 'off')
        }}

    - unique_id: open_verbinding_naar_buiten_zolder
      name: "Open verbinding naar buiten zolder"
      state: >
        {{
          is_state('binary_sensor.zolder_raam_openen', 'on')
        }}

    - unique_id: temperatuur_zolder_is_boven_drempel_waarden
      name: "Temperatuur zolder is boven drempel waarden"
      state: >
        {{ states('sensor.luchtkwaliteitsensor_zolder_temperatuur') | int >= (states('input_number.airco_zolder_drempelwaarde_koelen') | int) }}

    - unique_id: temperatuur_zolder_is_onder_drempel_waarden_verwarmen
      name: "Temperatuur zolder is onder drempel waarden verwarmen"
      state: >
        {{ states('sensor.luchtkwaliteitsensor_zolder_temperatuur') | float <= (states('input_number.airco_zolder_drempelwaarde_verwarmen') | float) }}

    # Airco Boven Mag Afkoelen
    - name: "Airco Boven Mag Afkoelen"
      unique_id: airco_boven_mag_afkoelen
      state: >
        {{ is_state('input_boolean.airco_boven_aan', 'on') and
           (is_state('input_boolean.airco_boven_moet_afkoelen', 'on') or
            (states('sensor.airco_boven_indoor') | float(0) > states('input_number.airco_boven_drempelwaarde_koelen') | float(26))) }}
      icon: mdi:snowflake

    # Airco Boven Mag Verwarmen
    - name: "Airco Boven Mag Verwarmen"
      unique_id: airco_boven_mag_verwarmen
      state: >
        {{ is_state('input_boolean.airco_boven_aan', 'on') and
           (is_state('input_boolean.airco_boven_moet_verwarmen', 'on') or
            (states('sensor.airco_boven_indoor') | float(0) < states('input_number.airco_boven_drempelwaarde_verwarmen') | float(18))) }}
      icon: mdi:fire

    # Airco Boven Mag Ventileren
    - name: "Airco Boven Mag Ventileren"
      unique_id: airco_boven_mag_ventileren
      state: >
        {{ is_state('input_boolean.airco_boven_aan', 'on') and
           not is_state('input_boolean.airco_boven_moet_afkoelen', 'on') and
           not is_state('input_boolean.airco_boven_moet_verwarmen', 'on') and
           (states('sensor.airco_boven_indoor') | float(0) >= states('input_number.airco_boven_drempelwaarde_verwarmen') | float(18)) and
           (states('sensor.airco_boven_indoor') | float(0) <= states('input_number.airco_boven_drempelwaarde_koelen') | float(26)) }}
      icon: mdi:fan

    # Airco Boven Mag Aan
    - name: "Airco Boven Mag Aan"
      unique_id: airco_boven_mag_aan
      state: >
        {{ is_state('input_boolean.airco_boven_aan', 'on') }}
      icon: mdi:air-conditioner

    - unique_id: open_verbinding_naar_buiten_badkamer
      name: "Open verbinding naar buiten badkamer"
      state: >
        {{
          is_state('binary_sensor.raam_badkamer_openen', 'on')
        }}

    - unique_id: radiatorkraan_badkamer_mag_aan
      name: "Radiatorkraan badkamer mag aan"
      state: >
        {{
          (
            (
              is_state('group.bewoners', 'home')
              and is_state('schedule.verwarming_badkamer', 'on')
            )
            or (
              is_state('input_boolean.vakantie_modus', 'on')
              and states('sensor.badkamer_multisensor_temperatuur') | float(99) < 5
            )
          )
          and is_state('binary_sensor.open_verbinding_naar_buiten_badkamer', 'off')
        }}

    - unique_id: bureau_zolder_bezet
      name: "Bureau zolder bezet"
      state: >
        {{ states('sensor.aanwezigheid_zolder_target_distance') | float(0) >= 2.0
           and states('sensor.aanwezigheid_zolder_target_distance') | float(0) < 4.0 }}
      delay_on:
        seconds: 2
      delay_off:
        seconds: 30

    - unique_id: bed_zolder_bezet
      name: "Bed zolder bezet"
      state: >
        {{ states('sensor.aanwezigheid_zolder_target_distance') | float(0) >= 3.5
           and states('sensor.aanwezigheid_zolder_target_distance') | float(0) <= 7.0 }}
      delay_on:
        seconds: 10
      delay_off:
        minutes: 10

    # Energie optimalisatie
    - name: "Stroomtarief onder Gemiddelde"
      unique_id: stroomtarief_onder_gemiddelde
      state: >
        {% set current = states('sensor.current_tariff') | float(0) %}
        {% set average = states('sensor.gemiddeld_stroomtarief_vandaag') | float(0) %}
        {{ current < average }}
      delay_on:
        minutes: 2
      delay_off:
        minutes: 2

    - name: "Stroomtarief Goedkoop (>10% onder gemiddelde)"
      unique_id: stroomtarief_goedkoop
      state: >
        {% set current = states('sensor.current_tariff') | float(0) %}
        {% set average = states('sensor.gemiddeld_stroomtarief_vandaag') | float(0) %}
        {% if average > 0 %}
          {{ current < (average * 0.9) }}
        {% else %}
          false
        {% endif %}
      delay_on:
        minutes: 2
      delay_off:
        minutes: 2

    - name: "Stroomtarief Duur (>10% boven gemiddelde)"
      unique_id: stroomtarief_duur
      state: >
        {% set current = states('sensor.current_tariff') | float(0) %}
        {% set average = states('sensor.gemiddeld_stroomtarief_vandaag') | float(0) %}
        {% if average > 0 %}
          {{ current > (average * 1.1) }}
        {% else %}
          false
        {% endif %}
      delay_on:
        minutes: 2
      delay_off:
        minutes: 2

# Hysterese rond koel- en verwarm-drempels van de airco woonkamer.
# Bron-sensor meet in stappen van 0,5 °C, dus zonder deadband flipt deze
# elke paar minuten op meetruis en jaagt de airco tussen cool/fan_only/off.
- trigger:
    - platform: state
      entity_id:
        - sensor.tstat_9d4027_current_temperature
        - input_number.airco_woonkamer_drempelwaarde_koelen
        - input_number.airco_woonkamer_drempelwaarde_verwarmen
        - input_number.airco_woonkamer_hysterese_boven
        - input_number.airco_woonkamer_hysterese_onder
    - platform: homeassistant
      event: start
  binary_sensor:
    - unique_id: temperatuur_woonkamer_is_boven_drempel_waarden
      name: "Temperatuur woonkamer is boven drempel waarden"
      delay_on: "00:03:00"
      delay_off: "00:03:00"
      state: >
        {% set temp = states('sensor.tstat_9d4027_current_temperature') | float(none) %}
        {% set drempel = states('input_number.airco_woonkamer_drempelwaarde_koelen') | float(none) %}
        {% set boven = states('input_number.airco_woonkamer_hysterese_boven') | float(0.5) %}
        {% set onder = states('input_number.airco_woonkamer_hysterese_onder') | float(0.3) %}
        {% set vorig = this.state if this.state in ['on', 'off'] else 'off' %}
        {% if temp is none or drempel is none %}
          {{ vorig }}
        {% elif vorig == 'on' %}
          {{ 'on' if temp > drempel - onder else 'off' }}
        {% else %}
          {{ 'on' if temp >= drempel + boven else 'off' }}
        {% endif %}

    - unique_id: temperatuur_woonkamer_is_onder_drempel_waarden_verwarmen
      name: "Temperatuur woonkamer is onder drempel waarden verwarmen"
      delay_on: "00:03:00"
      delay_off: "00:03:00"
      state: >
        {% set temp = states('sensor.tstat_9d4027_current_temperature') | float(none) %}
        {% set drempel = states('input_number.airco_woonkamer_drempelwaarde_verwarmen') | float(none) %}
        {% set boven = states('input_number.airco_woonkamer_hysterese_boven') | float(0.5) %}
        {% set onder = states('input_number.airco_woonkamer_hysterese_onder') | float(0.3) %}
        {% set vorig = this.state if this.state in ['on', 'off'] else 'off' %}
        {% if temp is none or drempel is none %}
          {{ vorig }}
        {% elif vorig == 'on' %}
          {{ 'on' if temp < drempel + onder else 'off' }}
        {% else %}
          {{ 'on' if temp <= drempel - boven else 'off' }}
        {% endif %}

- sensor:
    - unique_id: tarief_voorspelling_vandaag
      name: "Tarief Voorspelling Vandaag"
      state: >
        {% set forecast = state_attr('sensor.current_tariff', 'forecast') | default([]) %}
        {% set now_ts = now() %}
        {% set today_start = now_ts.replace(hour=0, minute=0, second=0, microsecond=0) %}
        {% set today_end = today_start + timedelta(days=1) %}
        {% set prices = [] %}
        {% for item in forecast %}
          {% if item.datetime is defined %}
            {% set dt = item.datetime | as_datetime %}
            {% if dt >= today_start and dt < today_end and item.electricity_price is defined %}
              {% set prices = prices + [{'hour': dt.hour, 'price': item.electricity_price / 10000000}] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% if prices | length >= 3 %}
          {% set sorted_prices = prices | sort(attribute='price') %}
          {% set cheapest = sorted_prices[:3] %}
          {% set most_expensive = sorted_prices[-3:] | reverse | list %}
          Goedkoopst: {% for p in cheapest %}{{ p.hour }}:00{% if not loop.last %}, {% endif %}{% endfor %}. Duurst: {% for p in most_expensive %}{{ p.hour }}:00{% if not loop.last %}, {% endif %}{% endfor %}.
        {% elif prices | length > 0 %}
          Beperkte tariefdata ({{ prices | length }} uren beschikbaar)
        {% else %}
          Geen tariefdata beschikbaar
        {% endif %}
      icon: mdi:chart-timeline-variant

    - unique_id: apparaten_tip
      name: "Apparaten Tip"
      state: >
        {% from 'cheapest_energy_hours.jinja' import cheapest_energy_hours %}
        {% set sensor = 'sensor.current_tariff' %}
        {% set search_start = now() %}
        {% set search_end = today_at("23:59") %}
        {% set best_time = cheapest_energy_hours(
            sensor=sensor,
            time_key='datetime',
            hours=1,
            start=search_start,
            end=search_end,
            include_tomorrow=false
          ) %}
        {% if best_time %}
          {% set best_hour = (best_time | as_datetime).hour %}
          {% set forecast = state_attr(sensor, 'forecast') | default([]) %}
          {% set price = namespace(value=none) %}
          {% for item in forecast %}
            {% if item.datetime is defined and (item.datetime | as_datetime).hour == best_hour %}
              {% set price.value = item.electricity_price / 10000000 %}
            {% endif %}
          {% endfor %}
          {% if price.value is not none %}
            Beste moment voor zware apparaten: {{ best_hour }}:00 (€{{ price.value | round(2) }}/kWh)
          {% else %}
            Beste moment voor zware apparaten: {{ best_hour }}:00
          {% endif %}
        {% else %}
          Geen tariefdata voor vandaag
        {% endif %}
      icon: mdi:washing-machine

    - unique_id: auto_laadadvies
      name: "Auto Laadadvies"
      state: >
        {% set charging_power = states('sensor.kwh_meter_id_5_vermogen') | float(0) %}
        {% set goedkope_stroom = is_state('binary_sensor.stroomtarief_onder_gemiddelde', 'on') %}
        {% set range_km = states('sensor.id_5_bram_battery_cruising_range') | float(-1) %}
        {% set extra_gereden = states('sensor.extra_gereden') | float(0) %}
        {% set battery_level = states('sensor.id_5_bram_battery_level') | float(-1) %}
        {% set is_charging = charging_power > 100 %}
        {% if is_charging %}
          Auto laadt ({{ (charging_power / 1000) | round(1) }} kW)
        {% elif range_km >= 0 and range_km < 50 %}
          {% if goedkope_stroom %}
            Laad nu! Bereik laag ({{ range_km | int }} km) en stroom is goedkoop
          {% else %}
            Bereik laag ({{ range_km | int }} km) - wacht op goedkope stroom
          {% endif %}
        {% elif range_km >= 0 %}
          {% set lease_info = '' %}
          {% if extra_gereden > 0 %}
            {% set lease_info = ' (' ~ (extra_gereden | int) ~ ' km over lease)' %}
          {% endif %}
          Auto: {{ range_km | int }} km{% if battery_level >= 0 %} ({{ battery_level | int }}%){% endif %}{{ lease_info }}
        {% else %}
          Auto status onbekend
        {% endif %}
      icon: mdi:car-electric
      attributes:
        is_laden: "{{ states('sensor.kwh_meter_id_5_vermogen') | float(0) > 100 }}"
        laadvermogen_kw: "{{ (states('sensor.kwh_meter_id_5_vermogen') | float(0) / 1000) | round(2) }}"
        bereik_km: "{{ states('sensor.id_5_bram_battery_cruising_range') | float(0) | int }}"
        batterij_pct: "{{ states('sensor.id_5_bram_battery_level') | float(0) | int }}"
        lease_km_over: "{{ states('sensor.extra_gereden') | float(0) | int }}"

    - unique_id: airco_geschatte_cop
      name: "Airco geschatte COP"
      unit_of_measurement: ""
      state: >
        {% set temp = states('sensor.airco_woonkamer_outdoor') | float(0) %}
        {% set cop = 3.635 + (temp * 0.095) %}
        {{ [2.0, [5.0, cop] | min] | max | round(2) }}
      icon: mdi:heat-pump

    - unique_id: airco_woonkamer_dynamische_offset
      name: "Airco Woonkamer Dynamische Offset"
      unit_of_measurement: "°C"
      state: >
        {# Boost modus override #}
        {% if is_state('input_boolean.airco_woonkamer_boost_modus', 'on') %}
          5.0
        {% else %}
          {# Basis waarden #}
          {% set basis_offset = 2.0 %}
          {% set setpoint = states('input_number.airco_woonkamer_drempelwaarde_verwarmen') | float(19) %}
          {% set huidige_temp = states('sensor.tstat_9d4027_current_temperature') | float(18) %}
          {% set cop = states('sensor.airco_geschatte_cop') | float(3.5) %}
          {% set handmatige_override = states('input_number.airco_woonkamer_temperatuur_offset') | float(0) %}

          {# Delta correctie met vloeiende afname boven drempel #}
          {% set overshoot = 0.5 %}
          {% set effectieve_drempel = setpoint + overshoot %}
          {% set temp_delta = effectieve_drempel - huidige_temp %}

          {% if temp_delta > 0 %}
            {# Onder drempel: positieve correctie (meer power) #}
            {% set delta_correctie = [[0, temp_delta * 0.5] | max, 2.0] | min %}
          {% else %}
            {# Boven drempel: negatieve correctie (airco moduleert/stopt) #}
            {% set delta_correctie = [[-3.0, temp_delta * 2.0] | max, 0] | min %}
          {% endif %}

          {# COP correctie: bij lage COP iets meer, bij hoge COP iets minder #}
          {% set cop_correctie = [[-0.5, (3.5 - cop) * 0.3] | max, 1.0] | min %}

          {# Handmatige override toevoegen als die != 0 #}
          {% set override_adjustment = handmatige_override if handmatige_override != 0 else 0 %}

          {# Totaal berekenen en begrenzen #}
          {% set totaal = basis_offset + delta_correctie + cop_correctie + override_adjustment %}
          {{ [[-5, totaal] | max, 5] | min | round(1) }}
        {% endif %}
      icon: mdi:thermometer-chevron-up
      attributes:
        basis_offset: 2.0
        temp_delta: >
          {% set overshoot = 0.5 %}
          {{ (states('input_number.airco_woonkamer_drempelwaarde_verwarmen') | float(19) + overshoot - states('sensor.tstat_9d4027_current_temperature') | float(18)) | round(1) }}
        delta_correctie: >
          {% set overshoot = 0.5 %}
          {% set effectieve_drempel = states('input_number.airco_woonkamer_drempelwaarde_verwarmen') | float(19) + overshoot %}
          {% set temp_delta = effectieve_drempel - states('sensor.tstat_9d4027_current_temperature') | float(18) %}
          {% if temp_delta > 0 %}
            {{ [[0, temp_delta * 0.5] | max, 2.0] | min | round(2) }}
          {% else %}
            {{ [[-3.0, temp_delta * 2.0] | max, 0] | min | round(2) }}
          {% endif %}
        cop_correctie: >
          {% set cop = states('sensor.airco_geschatte_cop') | float(3.5) %}
          {{ [[-0.5, (3.5 - cop) * 0.3] | max, 1.0] | min | round(2) }}
        handmatige_override: "{{ states('input_number.airco_woonkamer_temperatuur_offset') | float(0) }}"
        boost_actief: "{{ is_state('input_boolean.airco_woonkamer_boost_modus', 'on') }}"

    - unique_id: airco_kosten_per_kwh_warmte
      name: "Airco kosten per kWh warmte"
      unit_of_measurement: "€/kWh"
      device_class: monetary
      state: >
        {% set stroomprijs = states('sensor.current_tariff') | float(0.25) %}
        {% set cop = states('sensor.airco_geschatte_cop') | float(3.5) %}
        {{ (stroomprijs / cop) | round(4) }}
      icon: mdi:cash

    # Gas kosten per kWh warmte (CV-ketel)
    # 9.77 kWh per m³ gas, 88.8% seizoensrendement Intergas HRE
    - unique_id: gas_kosten_per_kwh_warmte
      name: "Gas kosten per kWh warmte"
      unit_of_measurement: "€/kWh"
      device_class: monetary
      state: >
        {% set gasprijs = states('sensor.zonneplan_current_gas_tariff') | float(1.20) %}
        {% set energie_per_m3 = 9.77 %}
        {% set rendement = 0.888 %}
        {{ (gasprijs / (energie_per_m3 * rendement)) | round(4) }}
      icon: mdi:gas-burner

    # COP omslagpunt: bij welke COP is gas even duur als airco?
    # Formule: COP = stroomprijs × 9.77 × 0.888 / gasprijs
    - unique_id: cop_omslagpunt
      name: "COP omslagpunt"
      unit_of_measurement: ""
      state: >
        {% set stroomprijs = states('sensor.current_tariff') | float(0.25) %}
        {% set gasprijs = states('sensor.zonneplan_current_gas_tariff') | float(1.20) %}
        {% set energie_per_m3 = 9.77 %}
        {% set rendement = 0.888 %}
        {{ (stroomprijs * energie_per_m3 * rendement / gasprijs) | round(2) }}
      icon: mdi:swap-horizontal

    # Aanbevolen verwarming op basis van huidige prijzen en COP
    - unique_id: aanbevolen_verwarming
      name: "Aanbevolen verwarming"
      state: >
        {% set cop = states('sensor.airco_geschatte_cop') | float(3.5) %}
        {% set cop_omslagpunt = states('sensor.cop_omslagpunt') | float(2.0) %}
        {% set marge = 0.3 %}
        {% if cop > cop_omslagpunt + marge %}
          airco
        {% elif cop < cop_omslagpunt - marge %}
          gas
        {% else %}
          hybride
        {% endif %}
      icon: >
        {% set aanbeveling = states('sensor.aanbevolen_verwarming') %}
        {% if aanbeveling == 'airco' %}
          mdi:heat-pump
        {% elif aanbeveling == 'gas' %}
          mdi:gas-burner
        {% else %}
          mdi:home-thermometer
        {% endif %}

  binary_sensor:
    # Vergelijking: is airco goedkoper dan gas?
    - unique_id: airco_goedkoper_dan_gas
      name: "Airco goedkoper dan gas"
      state: >
        {% set airco = states('sensor.airco_kosten_per_kwh_warmte') | float(0.10) %}
        {% set gas = states('sensor.gas_kosten_per_kwh_warmte') | float(0.15) %}
        {{ airco < gas }}
      icon: >
        {% if is_state('binary_sensor.airco_goedkoper_dan_gas', 'on') %}
          mdi:heat-pump
        {% else %}
          mdi:gas-burner
        {% endif %}

    # Moet gas gebruikt worden in plaats van airco?
    - unique_id: gebruik_gas_ipv_airco
      name: "Gebruik gas ipv airco"
      state: >
        {% set cop = states('sensor.airco_geschatte_cop') | float(3.5) %}
        {% set cop_omslagpunt = states('sensor.cop_omslagpunt') | float(2.0) %}
        {{ cop < cop_omslagpunt }}
      icon: mdi:gas-burner

# HomeWizard Batterij Laden - Trigger-based templates
# Deze sensoren worden bijgewerkt wanneer het batterijpercentage verandert
- trigger:
    - alias: Triggers on home assistant startup
      platform: homeassistant
      event: start
    - alias: Batterij percentage verandert
      platform: state
      entity_id: sensor.plug_in_battery_laadpercentage
    - alias: Periodieke update (elk uur)
      platform: time_pattern
      hours: "/1"
    - alias: Home Assistant start
      platform: homeassistant
      event: start
    - alias: Stroomtarief forecast update (rond het uur)
      platform: time_pattern
      minutes: "5"
  sensor:
    - unique_id: oplaadtijd_homewizard_accu
      name: "Oplaadtijd HomeWizard Accu"
      device_class: timestamp
      state: >
        {# Totale capaciteit van de batterij in kWh #}
        {% set capacity = 5.4 %}

        {# Huidig laadpercentage in % (0-100) #}
        {% set charge_pct = states('sensor.plug_in_battery_laadpercentage') | int(0) %}

        {# Laadvermogen in kW #}
        {% set power_kw = 1.6 %}

        {# Bereken hoeveel kWh er nog geladen moet worden #}
        {% set charge_missing_pct = 100 - charge_pct %}
        {% set kwh_missing = capacity * charge_missing_pct / 100 %}

        {# Bereken de benodigde laadtijd in uren #}
        {% set remaining_hours = kwh_missing / power_kw %}

        {# Alleen berekenen als er nog geladen moet worden #}
        {% if remaining_hours > 0.1 %}
          {%- set sensor = 'sensor.current_tariff' -%}
          {% from 'cheapest_energy_hours.jinja' import cheapest_energy_hours %}
          {{ cheapest_energy_hours(
                   sensor=sensor,
                   time_key='datetime',
                   hours=remaining_hours,
                   start=now(),
                   include_tomorrow=True
                   )
          }}
        {% else %}
          {{ None }}
        {% endif %}
      attributes:
        laadpercentage: "{{ states('sensor.plug_in_battery_laadpercentage') | int(0) }}"
        benodigde_uren: >
          {% set capacity = 5.4 %}
          {% set charge_pct = states('sensor.plug_in_battery_laadpercentage') | int(0) %}
          {% set power_kw = 1.6 %}
          {% set charge_missing_pct = 100 - charge_pct %}
          {% set kwh_missing = capacity * charge_missing_pct / 100 %}
          {{ (kwh_missing / power_kw) | round(2) }}

    - unique_id: eind_oplaadtijd_homewizard_accu
      name: "Eindtijd Laden HomeWizard Accu"
      device_class: timestamp
      state: >
        {% set start = states('sensor.oplaadtijd_homewizard_accu') %}
        {% if start not in ['unknown', 'unavailable', 'None', ''] %}
          {% set capacity = 5.4 %}
          {% set charge_pct = states('sensor.plug_in_battery_laadpercentage') | int(0) %}
          {% set power_kw = 1.6 %}
          {% set charge_missing_pct = 100 - charge_pct %}
          {% set kwh_missing = capacity * charge_missing_pct / 100 %}
          {% set remaining_hours = kwh_missing / power_kw %}
          {{ (start | as_datetime + timedelta(hours=remaining_hours)).isoformat() }}
        {% else %}
          {{ None }}
        {% endif %}

# Dagelijkse Briefing - Pre-midnight capture (23:59:58)
# Captures today's values BEFORE utility meters reset at midnight
- trigger:
    - alias: "HA startup - herstel sensor waarden"
      platform: homeassistant
      event: start
    - platform: time
      at: "23:59:58"
  sensor:
    - unique_id: energie_verbruik_gisteren
      name: "Energie Verbruik Gisteren"
      unit_of_measurement: "kWh"
      state: "{{ states('sensor.energy_consumed_today') | float(0) }}"
      icon: mdi:flash

    - unique_id: energie_productie_gisteren
      name: "Energie Productie Gisteren"
      unit_of_measurement: "kWh"
      state: "{{ states('sensor.energy_produced_today') | float(0) }}"
      icon: mdi:solar-power

    - unique_id: gas_verbruik_gisteren
      name: "Gas Verbruik Gisteren"
      unit_of_measurement: "m³"
      state: "{{ states('sensor.gas_consumed_today') | float(0) }}"
      icon: mdi:gas-burner

    - unique_id: gemiddeld_tarief_gisteren
      name: "Gemiddeld Tarief Gisteren"
      unit_of_measurement: "€/kWh"
      device_class: monetary
      state: "{{ states('sensor.gemiddeld_stroomtarief_vandaag') | float(0.25) }}"
      icon: mdi:currency-eur

    - unique_id: energie_kosten_gisteren
      name: "Energie Kosten Gisteren"
      unit_of_measurement: "€"
      device_class: monetary
      state: >
        {% set verbruik = states('sensor.energie_verbruik_gisteren') | float(0) %}
        {% set productie = states('sensor.energie_productie_gisteren') | float(0) %}
        {% set gemiddeld_tarief = states('sensor.gemiddeld_tarief_gisteren') | float(0.25) %}
        {% set teruglever_tarief = states('sensor.zonneplan_terugleververgoeding') | float(0.07) %}
        {% set netto = verbruik - productie %}
        {% if netto > 0 %}
          {{ (netto * gemiddeld_tarief) | round(2) }}
        {% else %}
          {{ (netto * teruglever_tarief) | round(2) }}
        {% endif %}
      icon: mdi:cash
      attributes:
        is_schatting: true
        toelichting: "Geschat op basis van gemiddeld dagtarief"

# EV Goedkoopste Laadtijd - zoekt goedkoopste uren in komende 24 uur
# Berekent eenmalig om 13:10 (na Zonneplan prijsupdate) om "schuivend window" te voorkomen
- trigger:
    - platform: homeassistant
      event: start
    - platform: time
      at: "13:10"
    - platform: state
      entity_id: input_number.ev_goedkoop_laden_uren
  sensor:
    - unique_id: ev_goedkoopste_laadtijd
      name: "EV Goedkoopste Laadtijd"
      device_class: timestamp
      state: >
        {%- set sensor = 'sensor.current_tariff' -%}
        {% from 'cheapest_energy_hours.jinja' import cheapest_energy_hours %}
        {% set hours = states('input_number.ev_goedkoop_laden_uren') | int(2) %}

        {# Zoekvenster: vanaf nu tot 24 uur later #}
        {% set current_hour = now().hour %}
        {% set search_start = today_at(current_hour ~ ":00") %}
        {% set search_end = search_start + timedelta(hours=24) %}

        {{ cheapest_energy_hours(
           sensor=sensor,
           time_key='datetime',
           hours=hours,
           start=search_start,
           end=search_end,
           include_tomorrow=true
        ) }}
      attributes:
        laadduur_uren: "{{ states('input_number.ev_goedkoop_laden_uren') | int(2) }}"
        eindtijd: >
          {% set start = states('sensor.ev_goedkoopste_laadtijd') %}
          {% set hours = states('input_number.ev_goedkoop_laden_uren') | int(2) %}
          {% if start not in ['unknown', 'unavailable', 'none', ''] %}
            {{ (start | as_datetime + timedelta(hours=hours)).isoformat() }}
          {% endif %}

    - unique_id: goedkoopste_tarief_komende_24u
      name: "Goedkoopste Tarief Komende 24u"
      unit_of_measurement: "€/kWh"
      device_class: monetary
      state: >
        {% set forecast = state_attr('sensor.current_tariff', 'forecast') %}
        {% if forecast and forecast | length > 0 %}
          {% set prices = forecast | map(attribute='electricity_price') | select('defined') | list %}
          {% if prices | length > 0 %}
            {{ (prices | min / 10000000) | round(4) }}
          {% else %}
            unknown
          {% endif %}
        {% else %}
          unknown
        {% endif %}

  binary_sensor:
    - unique_id: goedkoop_laden_beschikbaar
      name: "Goedkoop Laden Beschikbaar"
      state: >
        {% set min_price = states('sensor.goedkoopste_tarief_komende_24u') | float(1) %}
        {% set drempel = states('input_number.ev_goedkoop_laden_drempel') | float(0.25) %}
        {{ min_price < drempel }}
      attributes:
        minimum_tarief: "{{ states('sensor.goedkoopste_tarief_komende_24u') }}"
        drempel: "€{{ states('input_number.ev_goedkoop_laden_drempel') | float(0.25) }}"

    - unique_id: ev_thuis_niet_aangesloten
      name: "EV Thuis Niet Aangesloten"
      state: >
        {{ is_state('person.bram_wubs', 'home')
           and is_state('binary_sensor.ev_aangesloten', 'off') }}

# Gemigreerd vanuit legacy `- platform: template` (sensors.yaml).
# `default_entity_id` houdt de bestaande entity_id's intact zodat automations
# en dashboards blijven werken.
- sensor:
    - default_entity_id: sensor.lights_on_count
      unique_id: lights_on_count
      name: "Lampen aan"
      state: "{{ states.light | selectattr('state', 'equalto', 'on') | list | length }}"

    - default_entity_id: sensor.woonkamer_temperatuur
      unique_id: woonkamer_temperatuur
      name: "Woonkamer temperatuur"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      availability: "{{ state_attr('climate.thermostaat', 'current_temperature') is not none }}"
      state: "{{ state_attr('climate.thermostaat', 'current_temperature') }}"

    - default_entity_id: sensor.woonkamer_ingestelde_temperatuur
      unique_id: woonkamer_ingestelde_temperatuur
      name: "Woonkamer ingestelde temperatuur"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      availability: "{{ state_attr('climate.thermostaat', 'temperature') is not none }}"
      state: "{{ state_attr('climate.thermostaat', 'temperature') }}"

    - default_entity_id: sensor.dag_nl
      unique_id: dag_nl
      name: "dag nl"
      state: >-
        {% set dagen = ["Ma", "Di", "Wo", "Do", "Vr", "Za", "Zo"] %}
        {{ dagen[now().isoweekday()] }}

    - default_entity_id: sensor.maand_nl
      unique_id: maand_nl
      name: "maand nl"
      state: >-
        {% set maanden = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"] %}
        {{ maanden[now().month - 1] }}

    - default_entity_id: sensor.calculated_current_energy_usage
      unique_id: calculated_current_energy_usage
      name: "Berekend huidig enegie verbruik"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >-
        {% if states('sensor.power_produced') | int(0) > 0 %}
          -{{ states('sensor.power_produced') }}
        {% else %}
          {{ states('sensor.power_consumed') }}
        {% endif %}

    - default_entity_id: sensor.self_used_energy
      unique_id: self_used_energy
      name: "Zelf Gebruikte Energie"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      availability: >-
        {{ has_value('sensor.zonneplan_yield_today')
           and has_value('sensor.energy_produced_today') }}
      state: >-
        {{ (states('sensor.zonneplan_yield_today') | float) - (states('sensor.energy_produced_today') | float) }}

    - default_entity_id: sensor.self_sufficiency_score
      unique_id: self_sufficiency_score
      name: "Zelfredzaamheid Score"
      unit_of_measurement: "%"
      availability: >-
        {{ has_value('sensor.self_used_energy')
           and has_value('sensor.zonneplan_yield_today')
           and (states('sensor.zonneplan_yield_today') | float(0)) > 0 }}
      state: >-
        {{ (((states('sensor.self_used_energy') | float) / (states('sensor.zonneplan_yield_today') | float)) * 100) | round }}

    - default_entity_id: sensor.airco_woonkamer_target_temperatuur
      unique_id: airco_woonkamer_target_temperatuur
      name: "Airco Woonkamer Target Temperatuur"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      state: >-
        {% set huidige_temp = states('sensor.tstat_9d4027_current_temperature') | float(18) %}
        {% set drempel_verwarmen = states('input_number.airco_woonkamer_drempelwaarde_verwarmen') | float(19) %}
        {% set drempel_koelen = states('input_number.airco_woonkamer_drempelwaarde_koelen') | float(23) %}
        {% set offset = states('sensor.airco_woonkamer_dynamische_offset') | float(4.0) %}
        {% set overshoot = 0.5 %}
        {% if is_state('input_boolean.vakantie_modus', 'on') %}
          {{ states('input_number.airco_vakantie_temperatuur') | float }}
        {% elif huidige_temp < drempel_verwarmen + overshoot %}
          {{ drempel_verwarmen + offset }}
        {% elif huidige_temp > drempel_koelen %}
          {% if states('sensor.airco_woonkamer_outdoor') | int - states('input_number.maximaal_temperatuurverschil_airco') | int < drempel_koelen | int
              and huidige_temp | int - states('input_number.maximaal_temperatuurverschil_airco') | int < drempel_koelen | int %}
            {{ drempel_koelen }}
          {% else %}
            {{ states('sensor.airco_woonkamer_outdoor') | int - states('input_number.maximaal_temperatuurverschil_airco') | int }}
          {% endif %}
        {% else %}
          {{ huidige_temp | round(1) }}
        {% endif %}

    - default_entity_id: sensor.airco_zolder_ideale_temperatuur
      unique_id: airco_zolder_ideale_temperatuur
      name: "Airco Zolder Ideale Temperatuur"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      state: >-
        {% set extern = states('sensor.luchtkwaliteitsensor_zolder_temperatuur') | float(none) %}
        {% set intern = states('sensor.airco_zolder_indoor') | float(none) %}
        {% set drempel_koelen = states('input_number.airco_zolder_drempelwaarde_koelen') | float(22) %}
        {% set drempel_verwarmen = states('input_number.airco_zolder_drempelwaarde_verwarmen') | float(18) %}
        {% if extern is none or intern is none %}
          {{ none }}
        {% else %}
          {% set compensatie = intern - extern %}
          {% if extern >= drempel_koelen %}
            {{ (drempel_koelen - 1 + compensatie) | round(1) }}
          {% elif extern <= drempel_verwarmen %}
            {{ (drempel_verwarmen + compensatie) | round(1) }}
          {% else %}
            {{ (extern + compensatie) | round(1) }}
          {% endif %}
        {% endif %}
