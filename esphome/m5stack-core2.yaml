sensor:
  - platform: axp192
    model: M5CORE2
    address: 0x34
    i2c_id: bus_a
    id: axp192_id
    update_interval: 30s
    battery_level:
      name: "${upper_devicename} Battery Level"
      id: "${devicename}_batterylevel"

  - platform: mpu6886
    address: 0x68
    update_interval: 1s
    accel_x:
      name: "MPU6886 Accel X"
    accel_y:
      name: "MPU6886 Accel Y"
    accel_z:
      name: "MPU6886 Accel Z"
    gyro_x:
      name: "MPU6886 Gyro X"
    gyro_y:
      name: "MPU6886 Gyro Y"
    gyro_z:
      name: "MPU6886 Gyro Z"
    temperature:
      name: "MPU6886 Temperature"

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

i2c:
  - id: bus_a
    sda: GPIO21
    scl: GPIO22
    scan: true

display:
  - platform: mipi_spi
    model: M5CORE2

touchscreen:
  - platform: ft63x6
    interrupt_pin: GPIO39

binary_sensor:
  # the virtual buttons--coordinates taken from
  # https://github.com/m5stack/M5Core2/blob/0134dd3a38cfd335a1ec39da2c149f88baf54326/src/M5Core2.h#L54-L56
  # and
  # https://github.com/m5stack/M5Core2/blob/0134dd3a38cfd335a1ec39da2c149f88baf54326/src/utility/M5Button.h#L811-L815
  # for the parameter order `(x, y, width, height)`
  - platform: touchscreen
    name: Button A
    x_min: 10
    x_max: 120
    y_min: 240
    y_max: 280
    use_raw: true

  - platform: touchscreen
    name: Button B
    x_min: 130
    x_max: 200
    y_min: 240
    y_max: 280
    use_raw: true

  - platform: touchscreen
    name: Button C
    x_min: 230
    x_max: 310
    y_min: 240
    y_max: 280
    use_raw: true

font: 
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: icons
    size: 20
    bpp: 4
    glyphs: [
      "${midi_shuffle}", 
      "${midi_shuffle_disabled}", 
      "${midi_play}",
      "${midi_pause}",
      "${midi_skip_next}",
      "${midi_skip_previous}",
      "${midi_repeat}",
      "${midi_repeat_off}",
      "${midi_heart_outline}",
      "${midi_bluetooth_off}",
    ]
    
text_sensor:
  - platform: homeassistant
    id: media_player_state
    entity_id: $media_player
    on_value:
      - lvgl.button.update:
          id: btn_play_pause
          text: !lambda |-
            if(x == "playing") return "${midi_pause}"; 
            return "${midi_play}";
      - if:
          condition:
            lambda: 'return x == "unavailable";'
          then:
            - lvgl.page.show: standby_display
          else:
            - lvgl.page.show: player_display
  - platform: homeassistant
    id: media_player_shuffle
    entity_id: $media_player
    attribute: shuffle
    on_value:
      - lvgl.button.update:
          id: button_shuffle
          text: !lambda |-
            if(x == "on") return "${midi_shuffle}"; 
            return "${midi_shuffle_disabled}";
  - platform: homeassistant
    id: entity_picture
    entity_id: $media_player
    attribute: entity_picture
    on_value:
      - online_image.set_url:
          id: album_art
          url: !lambda "return x;"

  - platform: homeassistant
    entity_id: $media_player
    id: repeat
    attribute: repeat
  - platform: homeassistant
    entity_id: $media_player
    id: media_artist
    attribute: media_artist
    on_value:
      - lvgl.label.update:
          id: label_media_artist
          text: !lambda return x;
  - platform: homeassistant
    entity_id: $media_player
    id: media_title
    attribute: media_title
    on_value:
      - lvgl.label.update:
          id: label_media_title
          text: !lambda return x;

  - platform: homeassistant
    entity_id: $media_player
    id: media_album_name
    attribute: media_album_name
    on_value:
      - lvgl.label.update:
          id: label_media_album_name
          text: !lambda return x;
      

image:
  - platform: file
    id: no_art
    file: "images/cover_dark.png"
    type: RGB565
    resize: 150x150
  - platform: online_image
    id: album_art
    placeholder: no_art
    url: "http://wubsinfo.nl/never_fetched.jpg"
    format: JPEG
    type: RGB565
    resize: 150x150
    on_download_finished:
      - lvgl.image.update:
          id: album_art_widget
          src: album_art
    

lvgl:
  theme:
    dark_mode: true
  top_layer:
    widgets:
      - label:
          text: "\uF1EB"
          id: wifi_connected
          hidden: true
          align: top_left
          text_align: left
          text_color: 0xFFFFFF
  pages:
    - id: standby_display
      bg_color: 0x000000
      width: 320
      height: 240
      # pad_top: 20
      border_opa: TRANSP
      # scrollbar_mode: "OFF"
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: SPACE_EVENLY
        flex_align_track: START
        pad_row: 5px
        pad_column: 5px
      widgets:
        - container:
            pad_top: 50
            id: stanby_info
            layout: 
              type: FLEX
              flex_flow: COLUMN
              flex_align_cross: center
            align: CENTER
            widgets:
            - label:
                text_font: icons
                text: "${midi_bluetooth_off}"
            - label:
                text: "Box is uit"
    - id: player_display
      bg_color: 0x000000
      width: 320
      height: 240
      # pad_top: 20
      border_opa: TRANSP
      # scrollbar_mode: "OFF"
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: SPACE_EVENLY
        flex_align_track: START
        pad_row: 5px
        pad_column: 5px
      widgets:
        - container:
            id: track_info
            width: 320
            height: 170
            layout: HORIZONTAL
            widgets:
              - image:
                  id: album_art_widget
                  src: no_art
                  # align: TOP_LEFT
                  width: 150
                  height: 150
              - container:
                  layout: VERTICAL
                  width: 160px
                  height: 80px
                  widgets:
                    - label:
                        id: label_media_title
                        text: "[TITLE]"
                        long_mode: SCROLL
                    - label:
                        id: label_media_artist
                        text: "[Artiest]"
                        long_mode: SCROLL
                    - label:
                        id: label_media_album_name
                        text: "[Album]"
                        long_mode: DOT
        - container:
            outline_width: 1 
            id: player_controlls
            bg_color: red
            width: 320
            height: 30
            # pad_top: 10px
            layout: 
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_EVENLY
            widgets:
              - button:
                  id: button_like
                  bg_opa: 0%
                  text_font: icons
                  text: "${midi_heart_outline}"
                  ext_click_area: 10
                  on_click:
                    - homeassistant.action:
                        action: button.press
                        data:
                            entity_id: "button.workhorse_favorite_current_song"
              - button:
                  id: button_shuffle
                  bg_opa: 0%
                  text_font: icons
                  text: "${midi_shuffle}"
                  ext_click_area: 10
                  on_click:
                    - homeassistant.action:
                        action: media_player.shuffle_set
                        data:
                            entity_id: $media_player
                            shuffle: !lambda |- 
                              if(id(media_player_shuffle).state == "on") return "false";
                              return "true";
              - button:
                  id: bnt_prev
                  bg_opa: 0%
                  text_font: icons
                  text: "${midi_skip_previous}"
                  ext_click_area: 10
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_previous_track
                        data:
                           entity_id: $media_player
              - button:
                  id: btn_play_pause
                  bg_opa: 0%
                  text_font: icons
                  text: "${midi_play}"
                  ext_click_area: 10
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_play_pause
                        data:
                            entity_id: $media_player
              - button:
                  id: next
                  bg_opa: 0%
                  text_font: icons
                  text: "${midi_skip_next}"
                  ext_click_area: 10
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_next_track
                        data:
                            entity_id: $media_player

