substitutions:
  devicename: m5core2
  upper_devicename: M5Core2
  player: partybtlite_pi4
  media_player: "media_player.${player}"
  midi_shuffle_disabled: "\U000F049E"
  midi_shuffle: "\U000F049F"
  midi_play: "\U000F040A"
  midi_pause: "\U000F03E4"
  midi_skip_next: "\U000F04AD"
  midi_skip_previous: "\U000F04AE"
  midi_repeat: "\U000F0456"
  midi_repeat_off: "\U000F0457"
  midi_heart_outline: "\U000F02D5"
  midi_bluetooth_off: "\U000F00B2"

esphome:
  name: $devicename
  platformio_options:
    upload_speed: 460800
  friendly_name: M5Stack Core2

esp32:
  variant: esp32
  framework:
    type: arduino

psram:
  mode: quad
  speed: 80MHz


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "M5Stack-Core2 Fallback Hotspot"
    password: "DnqccjmdUMAy"

captive_portal:

# Enable Home Assistant API
api:
  encryption:
    key: !secret zolder_music_controller_encryption_key
  on_client_connected:
    - wait_until:
        condition:
          api.connected:
            state_subscription_only: true
    - lvgl.widget.show: wifi_connected
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.hide: wifi_connected

ota:
  platform: esphome
  encryption:

web_server:
  port: 80

http_request:

# Enable logging
logger:
  level: INFO


external_components:
