# ---------------------------------------------------------------------------
# Display - enkele pagina, landscape 960x540 (E-ink Design System)
# ---------------------------------------------------------------------------
display:
  - platform: it8951e
    id: m5paper_display
    cs_pin: GPIO15
    reset_pin: GPIO23
    reset_duration: 100ms
    busy_pin: GPIO27
    rotation: 0
    reversed: false
    update_interval: never
    lambda: |-
      // ===== STATUSBALK (hoogte 60) =====
      auto t = id(rtc_time).now();
      char tbuf[8];
      snprintf(tbuf, sizeof(tbuf), "%02d:%02d", t.hour, t.minute);
      it.print(24, 11, id(roboto_m40), tbuf);

      // huidige airco-modus (icoon + kort label)
      if (id(airco_hvac_mode).has_state()) {
        std::string am = id(airco_hvac_mode).state;
        if (am == "cool")          { it.print(150, 14, id(ic30), "\U000F0717"); it.print(186, 18, id(roboto_28), "Koel"); }
        else if (am == "heat")     { it.print(150, 14, id(ic30), "\U000F0238"); it.print(186, 18, id(roboto_28), "Warm"); }
        else if (am == "fan_only") { it.print(150, 14, id(ic30), "\U000F0210"); it.print(186, 18, id(roboto_28), "Vent"); }
        else if (am == "off")      { it.print(150, 14, id(ic30), "\U000F0425"); it.print(186, 18, id(roboto_28), "Uit"); }
        else if (am == "dry")      { it.print(150, 14, id(ic30), "\U000F058E"); it.print(186, 18, id(roboto_28), "Droog"); }
        else if (am == "auto")     { it.print(186, 18, id(roboto_28), "Auto"); }
      }

      // kamertemperatuur (betrouwbare sensor, niet de M5Paper-interne SHT30)
      it.print(344, 14, id(ic30), "\U000F050F");
      if (!isnan(id(airco_room_temp).state))
        eink_val(&it, 384, 18, id(roboto_28), TextAlign::TOP_LEFT,
                 id(airco_room_temp).state, 1, "°C");

      it.print(556, 14, id(ic30), "\U000F058E");
      if (!isnan(id(m5paper_humidity).state))
        eink_val(&it, 596, 18, id(roboto_28), TextAlign::TOP_LEFT,
                 id(m5paper_humidity).state, 0, "%");

      // warmwaterboiler: temperatuur + vlammetje als 'ie verwarmt
      it.print(670, 14, id(ic30), "\U000F0F92");
      if (!isnan(id(boiler_temp).state))
        eink_val(&it, 706, 18, id(roboto_28), TextAlign::TOP_LEFT,
                 id(boiler_temp).state, 0, "°");
      if (id(boiler_heating).state)
        it.print(768, 14, id(ic30), "\U000F0238");

      // douche-timer: alleen tonen als 'ie loopt (resterende minuten)
      if (!isnan(id(douche_remaining).state) && id(douche_remaining).state >= 0) {
        it.print(810, 14, id(ic30), "\U000F09A0");
        char db[8];
        snprintf(db, sizeof(db), "%dm", (int) id(douche_remaining).state);
        it.print(846, 18, id(roboto_28), db);
      }

      if (!isnan(id(wifi_signal_sensor).state))
        it.print(910, 13, id(ic32), "\U000F05A9");

      eink_hline(&it, 16, 60, 928, 3);

      // ============ HOOFDSCHERM (agenda) — current_screen == 0 ============
      if (id(current_screen) == 0) {
        // datum-paneel links
        eink_rect(&it, 16, 76, 300, 448, 3);
        it.print(40, 104, id(roboto_28), nl_weekday(t.day_of_week));
        char dbuf[4];
        snprintf(dbuf, sizeof(dbuf), "%d", t.day_of_month);
        it.print(34, 138, id(roboto_l120), dbuf);
        it.print(40, 300, id(roboto_l40), nl_month(t.month));
        eink_hline(&it, 40, 362, 120, 2);
        int cnt = isnan(id(agenda_count).state) ? 0 : (int) id(agenda_count).state;
        char cbuf[28];
        snprintf(cbuf, sizeof(cbuf), "%d afspra%s", cnt, (cnt == 1) ? "ak" : "ken");
        it.print(40, 380, id(roboto_b28), cbuf);
        it.print(40, 420, id(roboto_22), "vandaag");

        // prijs-pauze banner (alleen tijdens duur tarief), onderin het datum-paneel
        if (id(prijs_pauze).state) {
          it.filled_rectangle(18, 454, 296, 68);
          esphome::Color wpz(0, 0, 0);  // = WIT op deze driver
          it.print(40, 460, id(roboto_b28), wpz, "Stroom duur");
          if (id(prijs_high_einde).has_state() && id(prijs_high_einde).state.length() > 0) {
            std::string pzl = "tot " + id(prijs_high_einde).state;
            it.print(40, 492, id(roboto_22), wpz, pzl.c_str());
          }
        }

        // agenda rechts
        it.print(340, 92, id(roboto_b28), "Vandaag");
        eink_hline(&it, 340, 134, 110, 2);
        AgendaItem ag[4] = {
          agenda_parse(id(agenda_i1).has_state() ? id(agenda_i1).state : std::string("")),
          agenda_parse(id(agenda_i2).has_state() ? id(agenda_i2).state : std::string("")),
          agenda_parse(id(agenda_i3).has_state() ? id(agenda_i3).state : std::string("")),
          agenda_parse(id(agenda_i4).has_state() ? id(agenda_i4).state : std::string(""))
        };
        if (!ag[0].valid) {
          it.print(620, 296, id(roboto_28), TextAlign::CENTER, "Geen afspraken vandaag");
        } else {
          int ys[4] = {170, 232, 294, 356};
          int count = 0;
          for (int k = 0; k < 4; k++) if (ag[k].valid) count++;
          // nt = index van het eerste MORGEN-item (= aantal vandaag-items)
          int nt = 0;
          while (nt < count && !agenda_tomorrow(ag[nt])) nt++;
          int now_min = t.hour * 60 + t.minute;
          // p = aantal vandaag-items waarvan de start al voorbij/bezig is
          int p = 0;
          for (int k = 0; k < nt; k++) if (agenda_start_min(ag[k]) <= now_min) p++;
          int morgenB = (nt < count) ? nt : -1;   // grens waar "morgen" begint
          int nuB = (nt > 0) ? p : -1;             // nu-lijn alleen als er vandaag-items zijn
          if (nuB == morgenB) nuB = -1;            // morgen-divider wint op dezelfde grens

          for (int k = 0; k < count; k++)
            eink_agenda_draw(&it, ag[k], ys[k], id(roboto_28), id(roboto_28), id(roboto_22), id(ic28));

          esphome::Color w(0, 0, 0);  // = WIT op deze driver
          // grens-elementen: morgen-divider / nu-lijn / dunne scheidingslijn
          for (int b = 0; b <= count; b++) {
            int by = (b <= 0) ? 150 : (b >= count ? ys[count - 1] + 44 : ys[b] - 15);
            if (b == morgenB) {
              it.filled_rectangle(340, by - 13, 104, 26);
              it.print(392, by, id(roboto_22), w, TextAlign::CENTER, "morgen");
              eink_hline(&it, 452, by, 448, 3);
            } else if (b == nuB) {
              char nb[16];
              snprintf(nb, sizeof(nb), "nu %02d:%02d", t.hour, t.minute);
              it.filled_rectangle(340, by - 13, 112, 26);
              it.print(396, by, id(roboto_22), w, TextAlign::CENTER, nb);
              eink_hline(&it, 458, by, 442, 3);
            } else if (b > 0 && b < count) {
              eink_hline(&it, 340, by, 560, 2);
            }
          }

          int more = id(agenda_more).has_state() ? atoi(id(agenda_more).state.c_str()) : 0;
          if (more > 0) {
            char mbuf[28];
            snprintf(mbuf, sizeof(mbuf), "+%d meer vandaag", more);
            it.print(340, 412, id(roboto_m24), mbuf);
          }
        }

        // nav-knop "Klimaat >" (rechtsonder)
        eink_rect(&it, 648, 416, 280, 92, 3);
        it.print(688, 442, id(ic38), "\U000F0393");  // thermostaat
        it.print(738, 447, id(roboto_28), "Klimaat");
        it.print(850, 443, id(ic38), "\U000F0142");  // chevron-right
        return;
      }

      // ============ AIRCO-SCHERM — current_screen == 1 ============
      // ===== HVAC-PANEEL (links) =====
      eink_rect(&it, 16, 76, 600, 448, 3);
      it.print(40, 100, id(roboto_b28), "Klimaat");
      eink_hline(&it, 40, 138, 110, 2);

      // huidige kamertemperatuur (room sensor) - groot, linksboven
      if (!isnan(id(airco_room_temp).state))
        eink_val(&it, 28, 152, id(roboto_l120), TextAlign::TOP_LEFT,
                 id(airco_room_temp).state, 1, "°");
      else
        it.print(28, 152, id(roboto_l120), "--,-°");
      it.print(40, 282, id(roboto_22), "Huidige temperatuur");

      // doeltemperatuur als readout rechtsboven (kleiner dan huidige temp).
      // Toont de drempelwaarde (= wat de stepper verzet), mode-afhankelijk.
      it.print(352, 168, id(ic40), "\U000F0393");  // thermostaat
      bool tgt_heat = id(airco_hvac_mode).has_state() && id(airco_hvac_mode).state == "heat";
      float tgt_drempel = tgt_heat ? id(airco_drempel_verwarmen).state : id(airco_drempel_koelen).state;
      float tgt = (id(opt_target) >= 0.0f) ? id(opt_target) : tgt_drempel;
      if (!isnan(tgt))
        eink_val(&it, 404, 152, id(roboto_r72), TextAlign::TOP_LEFT, tgt, 1, "°");
      else
        it.print(404, 152, id(roboto_r72), "--,-°");
      it.print(356, 236, id(roboto_22), "Doeltemperatuur");

      // mode-grid 2x2 (links, onder de grote temp): Koel/Warm (y322) · Ventileren/Uit (y416)
      bool cool_on, heat_on, vent_on, off_on;
      if (id(opt_mode) >= 0) {  // optimistic: toon de zojuist getikte mode direct
        cool_on = id(opt_mode) == 0; heat_on = id(opt_mode) == 1;
        vent_on = id(opt_mode) == 2; off_on  = id(opt_mode) == 3;
      } else {
        cool_on = id(airco_hvac_mode).has_state() && id(airco_hvac_mode).state == "cool";
        heat_on = id(airco_hvac_mode).has_state() && id(airco_hvac_mode).state == "heat";
        vent_on = id(airco_hvac_mode).has_state() && id(airco_hvac_mode).state == "fan_only";
        off_on  = id(airco_hvac_mode).has_state() && id(airco_hvac_mode).state == "off";
      }
      eink_mode_btn(&it,  40, 322, 124, 84, id(ic36), "\U000F0717", id(roboto_m24), "Koel",       cool_on);
      eink_mode_btn(&it, 180, 322, 124, 84, id(ic36), "\U000F0238", id(roboto_m24), "Warm",       heat_on);
      eink_mode_btn(&it,  40, 416, 124, 84, id(ic36), "\U000F0210", id(roboto_m24), "Ventileren", vent_on);
      eink_mode_btn(&it, 180, 416, 124, 84, id(ic36), "\U000F0425", id(roboto_m24), "Uit",        off_on);

      // temp-stepper als icoon-trio op de bovenste mode-rij (y322): [-] [thermostaat] [+]
      eink_rect(&it, 330, 322, 72, 84, 3);
      it.print(344, 342, id(ic44), "\U000F0374");
      it.print(465, 364, id(ic40), TextAlign::CENTER, "\U000F0393");
      eink_rect(&it, 528, 322, 72, 84, 3);
      it.print(542, 342, id(ic44), "\U000F0415");

      // fan-stepper als icoon-trio op de onderste mode-rij (y416): [-] [fan waarde] [+]
      int fan = (id(opt_fan) >= 0) ? id(opt_fan)
                : (id(airco_fan_mode).has_state() ? fan_index(id(airco_fan_mode).state) : -1);
      eink_rect(&it, 330, 416, 72, 84, 3);
      it.print(344, 436, id(ic44), "\U000F0374");
      it.print(430, 458, id(ic30), TextAlign::CENTER, "\U000F0210");  // fan
      it.print(482, 458, id(roboto_b28), TextAlign::CENTER, fan_short(fan));
      eink_rect(&it, 528, 416, 72, 84, 3);
      it.print(542, 436, id(ic44), "\U000F0415");

      // ===== SWING-STANDEN (rechts, 2x3 grid; nachtlampjes verwijderd, grid ademt) =====
      it.print(648, 96, id(roboto_b28), "Stand");
      eink_hline(&it, 648, 134, 80, 2);
      int sw = (id(opt_swing) >= 0) ? id(opt_swing)
               : (id(airco_swing_mode).has_state() ? swing_index(id(airco_swing_mode).state) : -1);
      eink_text_btn(&it, 648, 150, 132, 76, id(roboto_m24), "Op/Neer", sw == 0);
      eink_text_btn(&it, 796, 150, 132, 76, id(roboto_m24), "Hoogst",  sw == 1);
      eink_text_btn(&it, 648, 238, 132, 76, id(roboto_m24), "Midden",  sw == 2);
      eink_text_btn(&it, 796, 238, 132, 76, id(roboto_m24), "Normaal", sw == 3);
      eink_text_btn(&it, 648, 326, 132, 76, id(roboto_m24), "Laagst",  sw == 4);
      eink_text_btn(&it, 796, 326, 132, 76, id(roboto_m24), "3D Auto", sw == 5);

      // ===== TERUG-KNOP (rechtsonder, zelfde plek als de Klimaat-knop) =====
      eink_rect(&it, 648, 416, 280, 92, 3);
      it.print(732, 443, id(ic38), "\U000F0141");  // chevron-left
      it.print(776, 447, id(roboto_28), "Terug");
