m5paper:
  battery_power_pin: GPIO5
  main_power_pin: GPIO2

# GT911: GEEN interrupt_pin. De M5Paper bedraadt de interrupt op GPIO36 (input-only);
# ESPHome 2026.3.0 (#14358) eist een output-capable pin -> config faalt. Maintainers
# bevestigen dat de GT911 zonder interrupt_pin terugvalt op polling. Prima bij USB-voeding.
touchscreen:
  - platform: gt911
    display: m5paper_display
    id: gt911_touchscreen
    # GT911 is 90° geroteerd + gespiegeld t.o.v. het display (empirisch via hoek-tikken:
    # display_x <-> raw_y recht, display_y <-> raw_x geinverteerd). swap_xy + mirror_y lijnt
    # de touch-coordinaten uit op de getekende layout (zones blijven in display-coords).
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: true
    on_touch:
      # Elke tik reset de inactiviteit-teller (voor auto-terug naar hoofdscherm).
      - lambda: 'id(idle_min) = 0;'

time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: Europe/Amsterdam
    on_time_sync:
      - bm8563.write_time
  - platform: bm8563
    id: rtc_time
    sleep_duration: 60000ms
    on_time:
      - seconds: 0
        then:
          - lambda: 'id(refresh_counter) += 1;'
          # Auto-terug: na ~2 min inactiviteit op het airco-scherm terug naar hoofdscherm.
          - lambda: |-
              id(idle_min) += 1;
              if (id(current_screen) == 1 && id(idle_min) >= 2) {
                id(current_screen) = 0;
                id(idle_min) = 0;
              }
          - if:
              condition:
                lambda: 'return id(refresh_counter) >= 15;'
              then:
                - lambda: 'id(refresh_counter) = 0;'
                - it8951e.clear
                - delay: 100ms
          - component.update: m5paper_display

# ---------------------------------------------------------------------------
# Sensors
# ---------------------------------------------------------------------------
sensor:
  - platform: sht3xd
    temperature:
      name: "${device_name} temperature"
      id: m5paper_temperature
      device_class: temperature
      state_class: measurement
    humidity:
      name: "${device_name} humidity"
      id: m5paper_humidity
      device_class: humidity
      state_class: measurement
    address: 0x44
    update_interval: 60s

  - platform: wifi_signal
    id: wifi_signal_sensor
    update_interval: 60s
    internal: true

  # Kamertemperatuur (losse master-bedroom sensor)
  - platform: homeassistant
    id: airco_room_temp
    entity_id: ${room_temp_entity}
    internal: true
    on_value:
      - component.update: m5paper_display

  # Airco-doel = de drempelwaarde (coöperatief): de stepper verzet de drempel, niet
  # de rauwe climate-setpoint. automation.airco_boven_handmatig leidt daar de echte
  # setpoint uit af (drempel ∓ offset). We lezen beide drempels en tonen/sturen de
  # actieve op basis van de hvac-mode (cool→koelen, heat→verwarmen).
  - platform: homeassistant
    id: airco_drempel_koelen
    entity_id: input_number.airco_boven_drempelwaarde_koelen
    internal: true
    on_value:
      # Reconcile: alleen relevant tijdens koelen; sla de 2e flash over als HA de gok bevestigt
      - lambda: |-
          if (!(id(airco_hvac_mode).has_state() && id(airco_hvac_mode).state == "cool")) return;
          bool skip = (id(opt_target) >= 0.0f) && (fabsf(id(opt_target) - x) < 0.05f);
          id(opt_target) = -1;
          if (!skip) id(m5paper_display).update();

  - platform: homeassistant
    id: airco_drempel_verwarmen
    entity_id: input_number.airco_boven_drempelwaarde_verwarmen
    internal: true
    on_value:
      # Reconcile: alleen relevant tijdens verwarmen
      - lambda: |-
          if (!(id(airco_hvac_mode).has_state() && id(airco_hvac_mode).state == "heat")) return;
          bool skip = (id(opt_target) >= 0.0f) && (fabsf(id(opt_target) - x) < 0.05f);
          id(opt_target) = -1;
          if (!skip) id(m5paper_display).update();

  # Hoofdscherm-agenda: aantal afspraken vandaag (state van de HA-agenda-sensor)
  - platform: homeassistant
    id: agenda_count
    entity_id: ${agenda_entity}
    internal: true

  # Statusbalk: warmwaterboiler temperatuur + resterende douche-tijd (minuten, -1=uit)
  - platform: homeassistant
    id: boiler_temp
    entity_id: sensor.boiler_huidige_temperatuur
    internal: true
  - platform: homeassistant
    id: douche_remaining
    entity_id: sensor.douche_timer_resterend
    internal: true

# ---------------------------------------------------------------------------
# Text sensors
# ---------------------------------------------------------------------------
text_sensor:
  - platform: homeassistant
    id: airco_hvac_mode
    entity_id: ${climate_entity}
    internal: true
    on_value:
      # Reconcile: sla de tweede flash over als HA de optimistic mode bevestigt
      - lambda: |-
          int m = -1;
          if (x == "cool") m = 0; else if (x == "heat") m = 1;
          else if (x == "fan_only") m = 2; else if (x == "off") m = 3;
          bool skip = (id(opt_mode) >= 0) && (id(opt_mode) == m);
          id(opt_mode) = -1;
          if (!skip) id(m5paper_display).update();

  # Airco swing-stand (louver-positie)
  - platform: homeassistant
    id: airco_swing_mode
    entity_id: ${climate_entity}
    attribute: swing_mode
    internal: true
    on_value:
      - lambda: |-
          bool skip = (id(opt_swing) >= 0) && (id(opt_swing) == swing_index(x));
          id(opt_swing) = -1;
          if (!skip) id(m5paper_display).update();

  # Airco ventilatorsnelheid
  - platform: homeassistant
    id: airco_fan_mode
    entity_id: ${climate_entity}
    attribute: fan_mode
    internal: true
    on_value:
      - lambda: |-
          bool skip = (id(opt_fan) >= 0) && (id(opt_fan) == fan_index(x));
          id(opt_fan) = -1;
          if (!skip) id(m5paper_display).update();

  # Hoofdscherm-agenda items "HH:MM|titel" (lege tijd = hele-dag) + overflow-teller.
  # Geen on_value: de minuut-tick hertekent het hoofdscherm toch al (klok).
  - platform: homeassistant
    id: agenda_i1
    entity_id: ${agenda_entity}
    attribute: i1
    internal: true
  - platform: homeassistant
    id: agenda_i2
    entity_id: ${agenda_entity}
    attribute: i2
    internal: true
  - platform: homeassistant
    id: agenda_i3
    entity_id: ${agenda_entity}
    attribute: i3
    internal: true
  - platform: homeassistant
    id: agenda_i4
    entity_id: ${agenda_entity}
    attribute: i4
    internal: true
  - platform: homeassistant
    id: agenda_more
    entity_id: ${agenda_entity}
    attribute: more
    internal: true

  # Eindtijd van het huidige/eerstvolgende dure (high) blok, "HH:MM" (leeg = geen)
  - platform: homeassistant
    id: prijs_high_einde
    entity_id: sensor.prijs_high_blok_einde
    internal: true

# ---------------------------------------------------------------------------
# Binary sensors
# ---------------------------------------------------------------------------
binary_sensor:
  # Boiler verwarmt? (vlammetje in de statusbalk)
  - platform: homeassistant
    id: boiler_heating
    entity_id: binary_sensor.ariston_is_heating
    internal: true

  # Prijs-pauze actief (dure stroom) -> banner op het hoofdscherm
  - platform: homeassistant
    id: prijs_pauze
    entity_id: input_boolean.prijs_pauze_groep_actief
    internal: true
    on_state:
      - component.update: m5paper_display

  # Fysieke BTN-knop (G38): forceer volledige verversing (ghosting wissen)
  - platform: gpio
    name: "${device_name} refresh knop"
    icon: mdi:refresh
    pin:
      number: GPIO38
      inverted: true
    on_release:
      - lambda: 'id(refresh_counter) = 0;'
      - it8951e.clear
      - delay: 100ms
      - component.update: m5paper_display

  # ---------------------------------------------------------------------------
  # Touch-zones (display-coordinaten 960x540). Airco-zones vuren alleen op het
  # airco-scherm (current_screen == 1); de navigatie-zone werkt altijd.
  # ---------------------------------------------------------------------------
  # --- Navigatie (rechtsonder, zelfde plek op beide schermen): toggelt scherm ---
  - platform: touchscreen
    name: "Navigatie"
    internal: true
    x_min: 648
    x_max: 928
    y_min: 416
    y_max: 508
    on_press:
      - lambda: 'id(current_screen) = (id(current_screen) == 0) ? 1 : 0;'
      - component.update: m5paper_display

  # --- Doeltemperatuur-trio (alleen airco-scherm) ---
  - platform: touchscreen
    name: "Temp Minus"
    internal: true
    x_min: 330
    x_max: 402
    y_min: 322
    y_max: 406
    on_press:
      - if:
          condition:
            lambda: 'return id(current_screen) == 1;'
          then:
            - lambda: |-
                bool heat = id(airco_hvac_mode).has_state() && id(airco_hvac_mode).state == "heat";
                float cur = heat ? id(airco_drempel_verwarmen).state : id(airco_drempel_koelen).state;
                float base = (id(opt_target) >= 0.0f) ? id(opt_target) : cur;
                if (isnan(base)) base = heat ? 19.0f : 24.0f;
                float lo = heat ? 10.0f : 18.0f;
                float hi = heat ? 30.0f : 35.0f;
                float v = base - 0.5f;
                if (v < lo) v = lo;
                if (v > hi) v = hi;
                id(opt_target) = v;
            - component.update: m5paper_display
            - homeassistant.action:
                action: input_number.set_value
                data_template:
                  entity_id: "{{ ent }}"
                  value: "{{ v }}"
                variables:
                  ent: !lambda |-
                    return (id(airco_hvac_mode).has_state() && id(airco_hvac_mode).state == "heat")
                      ? "input_number.airco_boven_drempelwaarde_verwarmen"
                      : "input_number.airco_boven_drempelwaarde_koelen";
                  v: !lambda 'return id(opt_target);'

  - platform: touchscreen
    name: "Temp Plus"
    internal: true
    x_min: 528
    x_max: 600
    y_min: 322
    y_max: 406
    on_press:
      - if:
          condition:
            lambda: 'return id(current_screen) == 1;'
          then:
            - lambda: |-
                bool heat = id(airco_hvac_mode).has_state() && id(airco_hvac_mode).state == "heat";
                float cur = heat ? id(airco_drempel_verwarmen).state : id(airco_drempel_koelen).state;
                float base = (id(opt_target) >= 0.0f) ? id(opt_target) : cur;
                if (isnan(base)) base = heat ? 19.0f : 24.0f;
                float lo = heat ? 10.0f : 18.0f;
                float hi = heat ? 30.0f : 35.0f;
                float v = base + 0.5f;
                if (v < lo) v = lo;
                if (v > hi) v = hi;
                id(opt_target) = v;
            - component.update: m5paper_display
            - homeassistant.action:
                action: input_number.set_value
                data_template:
                  entity_id: "{{ ent }}"
                  value: "{{ v }}"
                variables:
                  ent: !lambda |-
                    return (id(airco_hvac_mode).has_state() && id(airco_hvac_mode).state == "heat")
                      ? "input_number.airco_boven_drempelwaarde_verwarmen"
                      : "input_number.airco_boven_drempelwaarde_koelen";
                  v: !lambda 'return id(opt_target);'

  # --- Ventilatorsnelheid-trio (alleen airco-scherm) ---
  - platform: touchscreen
    name: "Fan Minus"
    internal: true
    x_min: 330
    x_max: 402
    y_min: 416
    y_max: 500
    on_press:
      - if:
          condition:
            lambda: 'return id(current_screen) == 1;'
          then:
            - lambda: |-
                int base = (id(opt_fan) >= 0) ? id(opt_fan) : fan_index(id(airco_fan_mode).state);
                if (base < 0) base = 0;
                base -= 1; if (base < 0) base = 0;
                id(opt_fan) = base;
            - component.update: m5paper_display
            - homeassistant.action:
                action: climate.set_fan_mode
                data:
                  entity_id: ${climate_entity}
                data_template:
                  fan_mode: "{{ m }}"
                variables:
                  m: !lambda 'return FAN_MODES[id(opt_fan)];'

  - platform: touchscreen
    name: "Fan Plus"
    internal: true
    x_min: 528
    x_max: 600
    y_min: 416
    y_max: 500
    on_press:
      - if:
          condition:
            lambda: 'return id(current_screen) == 1;'
          then:
            - lambda: |-
                int base = (id(opt_fan) >= 0) ? id(opt_fan) : fan_index(id(airco_fan_mode).state);
                if (base < 0) base = 0;
                base += 1; if (base > 4) base = 4;
                id(opt_fan) = base;
            - component.update: m5paper_display
            - homeassistant.action:
                action: climate.set_fan_mode
                data:
                  entity_id: ${climate_entity}
                data_template:
                  fan_mode: "{{ m }}"
                variables:
                  m: !lambda 'return FAN_MODES[id(opt_fan)];'

  # --- HVAC mode-grid 2x2 (alleen airco-scherm): Koel/Warm @ y322 · Droog/Uit @ y416 ---
  - platform: touchscreen
    name: "Mode Koel"
    internal: true
    x_min: 40
    x_max: 164
    y_min: 322
    y_max: 406
    on_press:
      - if:
          condition:
            lambda: 'return id(current_screen) == 1;'
          then:
            - lambda: 'id(opt_mode) = 0;'
            - component.update: m5paper_display
            - homeassistant.action:
                action: climate.set_hvac_mode
                data:
                  entity_id: ${climate_entity}
                  hvac_mode: cool

  - platform: touchscreen
    name: "Mode Warm"
    internal: true
    x_min: 180
    x_max: 304
    y_min: 322
    y_max: 406
    on_press:
      - if:
          condition:
            lambda: 'return id(current_screen) == 1;'
          then:
            - lambda: 'id(opt_mode) = 1;'
            - component.update: m5paper_display
            - homeassistant.action:
                action: climate.set_hvac_mode
                data:
                  entity_id: ${climate_entity}
                  hvac_mode: heat

  - platform: touchscreen
    name: "Mode Ventileren"
    internal: true
    x_min: 40
    x_max: 164
    y_min: 416
    y_max: 500
    on_press:
      - if:
          condition:
            lambda: 'return id(current_screen) == 1;'
          then:
            - lambda: 'id(opt_mode) = 2;'
            - component.update: m5paper_display
            - homeassistant.action:
                action: climate.set_hvac_mode
                data:
                  entity_id: ${climate_entity}
                  hvac_mode: fan_only

  - platform: touchscreen
    name: "Mode Uit"
    internal: true
    x_min: 180
    x_max: 304
    y_min: 416
    y_max: 500
    on_press:
      - if:
          condition:
            lambda: 'return id(current_screen) == 1;'
          then:
            - lambda: 'id(opt_mode) = 3;'
            - component.update: m5paper_display
            - homeassistant.action:
                action: climate.set_hvac_mode
                data:
                  entity_id: ${climate_entity}
                  hvac_mode: "off"

  # --- Swing-standen 2x3 (alleen airco-scherm): rijen y150/238/326, 132x76 ---
  - platform: touchscreen
    name: "Swing 0 Op-Neer"
    internal: true
    x_min: 648
    x_max: 780
    y_min: 150
    y_max: 226
    on_press:
      - if:
          condition:
            lambda: 'return id(current_screen) == 1;'
          then:
            - lambda: 'id(opt_swing) = 0;'
            - component.update: m5paper_display
            - homeassistant.action:
                action: climate.set_swing_mode
                data:
                  entity_id: ${climate_entity}
                  swing_mode: "Up/Down Auto"

  - platform: touchscreen
    name: "Swing 1 Hoogst"
    internal: true
