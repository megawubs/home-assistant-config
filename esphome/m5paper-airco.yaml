substitutions:
  device_name: M5Paper Airco
  # Te bedienen entities (pas hier aan als je een andere ruimte wilt):
  climate_entity: climate.airco_boven
  # Losse kamersensor (nauwkeuriger dan de airco-interne meting). Ondanks de naam
  # is dit de sensor in de master bedroom.
  room_temp_entity: sensor.luchtkwaliteitsensor_slaapkamer_temperatuur
  # Hoofdscherm-agenda (door HA samengevoegd uit gezins-/persoonskalenders).
  agenda_entity: sensor.m5paper_agenda

# ---------------------------------------------------------------------------
# Identiteit: hergebruikt bewust de slaapkamer device-naam + keys, zodat Home
# Assistant dit als HETZELFDE apparaat adopteert (vervangt de oude, niet-werkende
# m5paper-slaapkamer.yaml). Wil je een los apparaat? Geef dan een eigen `name`
# en genereer nieuwe api/ota keys.
# ---------------------------------------------------------------------------
esphome:
  name: m5paper-slaapkamer
  friendly_name: ${device_name}
  includes:
    - text_utils.h
    - hfiles/m5paper_airco.h
  on_boot:
    - priority: 220.0
      then:
        - it8951e.clear
        - delay: 100ms
        - component.update: m5paper_display
    - priority: -100.0
      then:
        - delay: 10s
        - component.update: m5paper_display

# IT8951 is NIET native in ESPHome (juni 2026) -> external component vereist.
# De lokale it8951e is gepatcht voor ESPHome 2026.x (get_loop_priority override
# verwijderd + App.feed_wdt() in de clear/write-lus tegen task-watchdog boot loop).
# m5paper + bm8563 komen van razqqm.
external_components:
  - source: github://razqqm/m5paper_esphome
    components: [m5paper, bm8563]
  - source:
      type: local
      path: components
    components: [it8951e]

esp32:
  board: m5stack-grey
  framework:
    type: arduino

logger:
  level: INFO

api:
  encryption:
    key: "SLsOsNZZWNNh49LZ++9o9I9oac1ZytcDx0820yK3l4I="

ota:
  - platform: esphome
    password: "85ee1d814688c0ac55374b08dc64c442"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "M5Paper-Airco"
    password: "Rk8mN3xPqF5v"

captive_portal:

psram:

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO12
  miso_pin: GPIO13

i2c:
  sda: GPIO21
  scl: GPIO22

globals:
  - id: refresh_counter
    type: int
    restore_value: no
    initial_value: '0'
  # Schermnavigatie: 0 = hoofdscherm (agenda), 1 = airco-bediening.
  - id: current_screen
    type: int
    restore_value: no
    initial_value: '0'
  # Minuten sinds laatste touch; >= 2 op airco-scherm -> automatisch terug naar hoofdscherm.
  - id: idle_min
    type: int
    restore_value: no
    initial_value: '0'
  # Optimistic UI: verwachte staat direct tonen bij een tik; gewist zodra HA bevestigt.
  - id: opt_mode         # -1 = geen, 0 = cool, 1 = heat, 2 = fan_only, 3 = off
    type: int
    restore_value: no
    initial_value: '-1'
  - id: opt_target       # < 0 = geen; anders verwachte doeltemperatuur
    type: float
    restore_value: no
    initial_value: '-1'
  - id: opt_swing        # -1 = geen; anders swing-index 0..5
    type: int
    restore_value: no
    initial_value: '-1'
  - id: opt_fan          # -1 = geen; anders fan-index 0..4
    type: int
    restore_value: no
    initial_value: '-1'

