esphome:
  name: wall-pad
  friendly_name: WallPad
esp32:
  variant: esp32p4
esp32_hosted:
  type: sdio
  variant: ESP32C6
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  reset_pin: GPIO54
  active_high: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:
  encryption:
    key: !secret wallpad_encryption_key

ota:
  platform: esphome
  encryption:

