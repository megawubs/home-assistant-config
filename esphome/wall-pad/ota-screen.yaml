ota:
  - platform: esphome
    id: ota_esphome
    encryption:
    on_begin:
      - light.turn_on:
          id: backlight
          brightness: 100%
          transition_length: 0s
      - lvgl.label.update:
          id: ota_label_title
          text: "Update starten…"
      - lvgl.label.update:
          id: ota_label_progress
          text: "Even geduld"
      - lvgl.bar.update:
          id: ota_bar_progress
          value: 0
      - lvgl.widget.show: ota_screen
      - lambda: "lv_obj_move_foreground(id(ota_screen));"
      - lvgl.widget.redraw:
      - lambda: "id(lvgl_component).loop();"
    on_progress:
      - lvgl.bar.update:
          id: ota_bar_progress
          value: !lambda return (int) x;
      - lvgl.label.update:
          id: ota_label_title
          text: "Firmware uploaden"
      - lvgl.label.update:
          id: ota_label_progress
          text: !lambda return str_sprintf("%.0f%%", x);
      - lambda: "id(lvgl_component).loop();"
    on_end:
      - lvgl.bar.update:
          id: ota_bar_progress
          value: 100
      - lvgl.label.update:
          id: ota_label_title
          text: "Update klaar"
      - lvgl.label.update:
          id: ota_label_progress
          text: "Herstarten…"
      - lambda: "id(lvgl_component).loop();"
    on_error:
      - logger.log:
          format: "OTA-fout %d"
          args: ["x"]
      - lvgl.label.update:
          id: ota_label_title
          text_color: "${status_fout}"
          text: "Update mislukt"
      - lvgl.label.update:
          id: ota_label_progress
          text: "Herstarten…"
      - lambda: "id(lvgl_component).loop();"

lvgl:
  id: lvgl_component
  top_layer:
    widgets:
      - obj:
          id: ota_screen
          hidden: true
          ignore_layout: true
          clickable: false
          width: 100%
          height: 100%
          align: CENTER
          radius: 0
          border_width: 0
          bg_color: "${bg_primary}"
          bg_opa: COVER
          widgets:
            - label:
                id: ota_label_title
                align: CENTER
                y: -50
                text_font: montserrat_24
                text_color: "${text_primary}"
                text: "Update starten…"
            - label:
                id: ota_label_progress
                align: CENTER
                y: -10
                text_font: montserrat_16
                text_color: "${text_secondary}"
                text: "Even geduld"
            - bar:
                id: ota_bar_progress
                align: CENTER
                y: 40
                width: 400
                height: 12
                min_value: 0
                max_value: 100
                value: 0
                radius: 6
                bg_color: "${border}"
                bg_opa: COVER
                indicator:
                  bg_color: "${blue_400}"
                  radius: 6
