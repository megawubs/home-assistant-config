# vars:
#   uid:    unique identifier → ids worden ${uid}_button, ${uid}_icon en ${uid}_label
#   label:  tekst op de button
#
button:
  id: ${uid}_button
  state:
    checked: !lambda return id(selected_climate) == "${uid}";
  bg_opa: TRANSP
  layout:
    type: flex
    flex_flow: row
    flex_align_track: CENTER
    flex_align_main: CENTER
    flex_align_cross: CENTER
  radius: 10
  text_color: "${slate_300}"
  checked:
    bg_opa: COVER
    bg_color: "${border}"
    text_color: "${text_primary}"
  on_press: 
    - script.execute:
        id: script_climate_widget
        uid: "${uid}"
  widgets:
    - label:
        id: ${uid}_icon
        text_font: icons20
        text: "${mdi_circle_small}"
    - label:
        id: ${uid}_label
        text_font: montserrat_14
        text: "${label}"
