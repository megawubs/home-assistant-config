esp32:
  variant: esp32p4
  cpu_frequency: 360MHz
  framework: 
    type: esp-idf
    advanced:
      execute_from_psram: true
      enable_idf_experimental_features: true
  flash_size: 32MB

esp32_hosted:
  type: sdio
  variant: ESP32C6
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  reset_pin: GPIO54
  active_high: true
  use_psram: true

esp_ldo:
  - channel: 3
    id: display_supply_ldo
    voltage: 2.5V

psram:
  mode: hex
  speed: 200MHz

http_request:
  verify_ssl: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} AP"
    password: !secret ap_password

captive_portal:

logger:
  level: DEBUG
  hardware_uart: UART0

api:
  encryption:
    key: !secret wallpad_encryption_key
  on_client_connected:
    - wait_until:
        condition:
          api.connected:
            state_subscription_only: true
    - script.execute: ha_connected
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - script.execute: ha_disconnected

ota:
  platform: esphome
  encryption:

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 300ms
    connection_scan_window: 30ms
    active: true

bluetooth_proxy:
  active: true

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Amsterdam
    on_time_sync:
      - script.execute: time_update
    on_time: 
      - minutes: '*'
        seconds: 0
        then: 
          - script.execute: time_update

sensor:
  - platform: wifi_signal
    name: "Signal strength"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    id: device_uptime
    update_interval: 60s
    entity_category: diagnostic

  - platform: internal_temperature
    name: "Chip temperature"
    id: chip_temperature
    update_interval: 60s
    entity_category: diagnostic


script:
  - id: time_update
  - id: ha_connected
  - id: ha_disconnected

