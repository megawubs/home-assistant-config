packages:
  page_icon: !include 
    file: ../../ui/templates/page-icon.yaml
    vars: 
      uid: energy
      label: "Energie"
      icon: "${mdi_lightning_bolt}"
      checked_color: "${emerald_400}"
      page_id: page_energy

lvgl:
  pages:
    - id: page_energy
      bg_color: "${bg_primary}"
      layout:
        type: flex
        flex_flow: row
        flex_align_main: space_evenly
        flex_align_track: center
        flex_align_cross: center
      widgets:
        - container:
            id: container_energy_widget
            layout:
              type: flex
              flex_flow: column
              flex_align_main: space_evenly
              flex_align_track: center
              flex_align_cross: center
            widgets:
              - label:
                  id: energy_wip
                  text: "Energy WIP"
