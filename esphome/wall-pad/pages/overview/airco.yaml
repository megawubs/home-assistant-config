# vars:
#   page_id: 
#   container: 
#   widget: 
#
globals:
  - id: selected_arico
    type: std::string
    restore_value: yes
    initial_value: '"airco_woonkamer"'
    max_restore_data_length: 30

mapping:
  - id: airco_entity
    from: string
    to: string
    entries:
      airco_woonkamer: "climate.airco_woonkamer"
      airco_boven: "climate.airco_boven"
      airco_zolder: "climate.airco_zolder"

lvgl:
  pages: 
    - id: !extend $page_id
      widgets:
        - container:
            id: !extend $container
            widgets: 
              - container:
                  id: !extend $widget
                  flex_grow: 2
                  bg_color: "${bg_ink}"
                  radius: 14
                  bg_opa: COVER
                  border_opa: COVER
                  border_color: ${border_gunmetal}
                  pad_left: 20px
                  pad_right: 20px
                  pad_top: 18px
                  pad_bottom: 18px
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: start
                    flex_align_track: start
                    pad_row: 16px
                  widgets:
                    - container:
                        id: widget_arico_title
                        flex_grow: 1
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_main: center
                          flex_align_track: center
                          flex_align_cross: center
                          pad_column: 10px
                        widgets:
                          - label:
                              text_font: icons20
                              text_color: "${blue_400}"
                              text: "${mdi_air_conditioner}"
                          - container:
                              id: airco_widget_buttons_grid
                              flex_grow: 1
                              height: 53px
                              bg_color: "${bg_ink}"
                              bg_opa: COVER
                              border_color: "${border_gunmetal}"
                              border_opa: COVER
                              border_width: 1
                              pad_all: 4px
                              radius: 14
                              layout:
                                type: grid
                                grid_columns: [FR(1), FR(1), FR(1)]
                                pad_column: 6px
                                grid_cell_x_align: STRETCH
                                grid_cell_y_align: STRETCH
                              widgets:
                                - !include
                                    file: ../../ui/templates/segment-button.yaml
                                    vars:
                                      uid: airco_woonkamer
                                      entity: climate.woonkamer
                                      label: "Beneden"
                                - !include
                                    file: ../../ui/templates/segment-button.yaml
                                    vars:
                                      uid: airco_boven
                                      entity: climate.airco_boven
                                      label: "Boven"
                                - !include
                                    file: ../../ui/templates/segment-button.yaml
                                    vars:
                                      uid: airco_zolder
                                      entity: climate.airco_zolder
                                      label: "Zolder"
                    - container:
                        flex_grow: 1
                        layout: 
                          type: flex
                          flex_flow: row
                          flex_align_main: space_between
                          flex_align_track: center
                          # flex_align_cross: center
                          pad_column: 14px
                        widgets:
                          - button:
                              id: airco_plus
                              radius: 255
                              bg_opa: TRANSP
                              border_color: "${border_gunmetal}"
                              border_opa: COVER
                              border_post: true
                              border_width: 2
                              widgets:
                                - label:
                                    text_font: montserrat_32
                                    text_color: "${blue_400}"
                                    text: "+"
                          - label:
                              text_font: montserrat_46
                              text_color: "${blue_400}"
                              text: "18.5"
                          - button:
                              id: airco_min
                              radius: 255
                              bg_opa: TRANSP
                              border_color:  "${border_gunmetal}"
                              border_opa: COVER
                              border_width: 2
                              border_post: true
                              widgets:
                                - label:
                                    text_font: montserrat_32
                                    text_color: "${blue_400}"
                                    text: "-"
                          

script:
  - id: script_airco_widget
    parameters:
      uid: string
    then:
      - logger.log: 
          format: "%s pressed, selected_arico: %s"
          args: ['uid.c_str()', 'id(selected_arico).c_str()']
      - globals.set:
          id: selected_arico
          value: !lambda return uid;
      - lvgl.widget.update:
          id: airco_woonkamer_button
          state:
            checked: !lambda return id(selected_arico) == "airco_woonkamer";
      - lvgl.widget.update:
          id: airco_boven_button
          state:
            checked: !lambda return id(selected_arico) == "airco_boven";
      - lvgl.widget.update:
          id: airco_zolder_button
          state:
            checked: !lambda return id(selected_arico) == "airco_zolder";
      - logger.log: 
          format: "script done, selected_arico: %s"
          args: ['id(selected_arico).c_str()']


      
