# vars:
#   page_id: 
#   container: 
#   widget: 
#
esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute:
            id: script_climate_widget
            uid: !lambda return id(selected_climate);

globals:
  - id: selected_climate
    type: std::string
    restore_value: yes
    initial_value: '"climate_woonkamer"'
    max_restore_data_length: 30

  - id: climate_displayed_target
    type: float
    initial_value: 'NAN'

  - id: climate_displayed_mode
    type: std::string
    initial_value: '""'

  - id: climate_displayed_fan_mode
    type: std::string
    initial_value: '""'

  - id: climate_displayed_boost
    type: bool
    initial_value: 'false'

mapping:
  - id: climate_boost_entity
    from: string
    to: string
    entries:
      climate_woonkamer: "input_boolean.airco_woonkamer_boost_modus"
      climate_slaapkamer: "input_boolean.airco_boven_boost_modus"
      climate_zolder: "input_boolean.airco_zolder_boost_modus"

  - id: climate_boost_sensor
    from: string
    to: binary_sensor::BinarySensor
    entries:
      climate_woonkamer: climate_woonkamer_boost
      climate_slaapkamer: climate_slaapkamer_boost
      climate_zolder: climate_zolder_boost

  - id: climate_fan_sensor
    from: string
    to: text_sensor::TextSensor
    entries:
      climate_woonkamer: climate_woonkamer_fan_mode
      climate_slaapkamer: climate_slaapkamer_fan_mode
      climate_zolder: climate_zolder_fan_mode

  - id: climate_fan_label
    from: string
    to: string
    default_value: "Ventilator"
    entries:
      "auto": "Automatisch"
      "1 Lowest": "1 • Laagst"
      "2 Low": "2 • Laag"
      "3 High": "3 • Hoog"
      "4 Highest": "4 • Hoogst"

  - id: climate_fan_icon
    from: string
    to: string
    default_value: "${mdi_fan}"
    entries:
      "auto": "${mdi_fan_auto}"
      "1 Lowest": "${mdi_fan_speed_1}"
      "2 Low": "${mdi_fan_speed_2}"
      "3 High": "${mdi_fan_speed_3}"
      "4 Highest": "${mdi_fan_plus}"

  - id: climate_target_sensor
    from: string
    to: sensor::Sensor
    entries:
      climate_woonkamer: climate_woonkamer_target
      climate_slaapkamer: climate_slaapkamer_target
      climate_zolder: climate_zolder_target

  - id: climate_mode_color
    from: string
    to: int
    default_value: ${gray_500}
    entries:
      "off": ${gray_500}
      fan_only: ${lime_300}
      dry: ${teal_400}
      cool: ${blue_400}
      heat: ${orange_400}
      auto: ${indigo_400}

  - id: climate_mode_icon
    from: string
    to: string
    default_value: "${mdi_circle_small}"
    entries:
      "off": "${mdi_power}"
      fan_only: "${mdi_fan}"
      dry: "${mdi_water_percent}"
      cool: "${mdi_snowflake}"
      heat: "${mdi_fire}"
      auto: "${mdi_thermostat_auto}"

  - id: climate_mode_sensor
    from: string
    to: text_sensor::TextSensor
    entries:
      climate_woonkamer: climate_woonkamer_mode
      climate_slaapkamer: climate_slaapkamer_mode
      climate_zolder: climate_zolder_mode

lvgl:
  pages: 
    - id: !extend $page_id
      widgets:
        - container:
            id: !extend $container
            widgets: 
              - container:
                  id: !extend $widget
                  height: SIZE_CONTENT
                  overflow_visible: true
                  scrollable: false
                  bg_color: "${bg_ink}"
                  radius: 24
                  bg_opa: COVER
                  border_opa: COVER
                  border_width: 1
                  border_color: "${border}"
                  pad_left: 20px
                  pad_right: 20px
                  pad_top: 18px
                  pad_bottom: 18px
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: start
                    flex_align_track: start
                    pad_row: 8px
                  widgets:
                    - container:
                        id: climate_widget_title
                        height: SIZE_CONTENT
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_main: center
                          flex_align_track: center
                          flex_align_cross: center
                          pad_column: 10px
                        widgets:
                          - label:
                              id: climate_widget_icon
                              text_font: icons20
                              text_color: "${blue_400}"
                              text: "${mdi_air_conditioner}"
                          - container:
                              id: climate_widget_buttons_grid
                              flex_grow: 1
                              height: 53px
                              bg_color: "${bg_secondary}"
                              bg_opa: COVER
                              border_color: "${border}"
                              border_opa: COVER
                              border_width: 1
                              pad_all: 4px
                              radius: 14
                              layout:
                                type: grid
                                grid_columns: [FR(1), FR(1), FR(1)]
                                pad_column: 6px
                                grid_cell_x_align: STRETCH
                                grid_cell_y_align: STRETCH
                              widgets:
                                - !include
                                    file: ../../ui/templates/climate-button.yaml
                                    vars:
                                      uid: climate_woonkamer
                                      label: "Beneden"
                                - !include
                                    file: ../../ui/templates/climate-button.yaml
                                    vars:
                                      uid: climate_slaapkamer
                                      label: "Boven"
                                - !include
                                    file: ../../ui/templates/climate-button.yaml
                                    vars:
                                      uid: climate_zolder
                                      label: "Zolder"
                    - container:
                        height: SIZE_CONTENT
                        layout: 
                          type: flex
                          flex_flow: row
                          flex_align_main: space_between
                          flex_align_track: center
                          # flex_align_cross: center
                          pad_column: 14px
                        widgets:
                          - button:
                              id: climate_min
                              width: 60px
                              height: 60px
                              pad_all: 0
                              radius: 255
                              bg_color: "${zinc_900}"
                              bg_opa: COVER
                              border_color: "${slate_800}"
                              border_opa: COVER
                              border_width: 2
                              border_post: true
                              on_press:
                                - script.execute:
                                    id: script_climate_step
                                    delta: -0.5
                              widgets:
                                - label:
                                    align: CENTER
                                    text_font: icons
                                    text_color: "${text_primary}"
                                    text: "${mdi_minus}"
                          - label:
                              id: climate_target_label
                              text_font: montserrat_46
                              text_color: "${blue_400}"
                              text: "--.-°"
                          - button:
                              id: climate_plus
                              width: 60px
                              height: 60px
                              pad_all: 0
                              radius: 255
                              bg_color: "${zinc_900}"
                              bg_opa: COVER
                              border_color: "${slate_800}"
                              border_opa: COVER
                              border_post: true
                              border_width: 2
                              on_press:
                                - script.execute:
                                    id: script_climate_step
                                    delta: 0.5
                              widgets:
                                - label:
                                    align: CENTER
                                    text_font: icons
                                    text_color: "${text_primary}"
                                    text: "${mdi_plus}"
                    - container:
                        id: climate_widget_mode_grid
                        margin_top: 4px
                        height: SIZE_CONTENT
                        bg_color: "${bg_secondary}"
                        bg_opa: COVER
                        border_color: "${border}"
                        border_opa: COVER
                        border_width: 1
                        radius: 14
                        pad_all: 4px
                        layout:
                          type: grid
                          grid_columns: [FR(1), FR(1), FR(1), FR(1), FR(1), FR(1)]
                          pad_column: 4px
                          grid_cell_x_align: STRETCH
                        widgets:
                            - !include
                                file: ../../ui/templates/climate-mode-button.yaml
                                vars:
                                  mode: "off"
                                  icon: "${mdi_power}"
                                  checked_color: "${text_primary}"
                                  checked_bg: "${slate_800}"
                                  checked_bg_opa: COVER
                            - !include
                                file: ../../ui/templates/climate-mode-button.yaml
                                vars:
                                  mode: fan_only
                                  icon: "${mdi_fan}"
                                  checked_color: "${lime_300}"
                                  checked_bg: "${lime_300}"
                                  checked_bg_opa: 18%
                            - !include
                                file: ../../ui/templates/climate-mode-button.yaml
                                vars:
                                  mode: dry
                                  icon: "${mdi_water_percent}"
                                  checked_color: "${teal_400}"
                                  checked_bg: "${teal_400}"
                                  checked_bg_opa: 18%
                            - !include
                                file: ../../ui/templates/climate-mode-button.yaml
                                vars:
                                  mode: cool
                                  icon: "${mdi_snowflake}"
                                  checked_color: "${blue_400}"
                                  checked_bg: "${blue_400}"
                                  checked_bg_opa: 18%
                            - !include
                                file: ../../ui/templates/climate-mode-button.yaml
                                vars:
                                  mode: heat
                                  icon: "${mdi_fire}"
                                  checked_color: "${orange_400}"
                                  checked_bg: "${orange_400}"
                                  checked_bg_opa: 18%
                            - !include
                                file: ../../ui/templates/climate-mode-button.yaml
                                vars:
                                  mode: auto
                                  icon: "${mdi_thermostat_auto}"
                                  checked_color: "${indigo_400}"
                                  checked_bg: "${indigo_400}"
                                  checked_bg_opa: 18%
                    - container:
                        height: SIZE_CONTENT
                        layout:
                          type: flex
                          flex_flow: row
                          pad_column: 8px
                        widgets:
                          - button:
                              id: climate_fan_button
                              flex_grow: 1
                              height: 48px
                              radius: 12
                              pad_left: 12px
                              pad_right: 12px
                              bg_color: "${bg_secondary}"
                              bg_opa: COVER
                              border_color: "${border}"
                              border_opa: COVER
                              border_width: 1
                              layout:
                                type: flex
                                flex_flow: row
                                flex_align_cross: CENTER
                                flex_align_track: CENTER
                                pad_column: 10px
                              on_press:
                                - if:
                                    condition:
                                      lambda: return lv_obj_has_flag(id(climate_fan_popup), LV_OBJ_FLAG_HIDDEN);
                                    then:
                                      - lvgl.widget.show: climate_fan_popup
                                    else:
                                      - lvgl.widget.hide: climate_fan_popup
                              widgets:
                                - label:
                                    id: climate_fan_button_icon
                                    text_font: icons24
                                    text_color: "${text_secondary}"
                                    text: "${mdi_fan}"
                                - label:
                                    id: climate_fan_button_label
                                    flex_grow: 1
                                    text_font: montserrat_16
                                    text_color: "${text_primary}"
                                    text: "Ventilator"
                                - label:
                                    text_font: icons24
                                    text_color: "${text_secondary}"
                                    text: "${mdi_menu_down}"
                          - button:
                              id: climate_boost_button
                              height: 48px
                              radius: 12
                              pad_left: 14px
                              pad_right: 14px
                              bg_color: "${bg_secondary}"
                              bg_opa: COVER
                              border_color: "${border}"
                              border_opa: COVER
                              border_width: 1
                              text_color: "${text_secondary}"
                              layout:
                                type: flex
                                flex_flow: row
                                flex_align_cross: CENTER
                                flex_align_track: CENTER
                                pad_column: 8px
                              checked:
                                bg_color: "${orange_400}"
                                bg_opa: 14%
                                border_color: "${orange_400}"
                                border_opa: 50%
                                text_color: "${text_primary}"
                              on_press:
                                - script.execute: script_climate_toggle_boost
                              widgets:
                                - label:
                                    id: climate_boost_icon
                                    text_font: icons20
                                    text_color: "${gray_500}"
                                    text: "${mdi_rocket_launch_outline}"
                                - label:
                                    text_font: montserrat_16
                                    text: "Boost"
                    - container:
                        id: climate_fan_popup
                        hidden: true
                        ignore_layout: true
                        align: BOTTOM_LEFT
                        y: -56px
                        width: 100%
                        height: SIZE_CONTENT
                        bg_color: "${zinc_900}"
                        bg_opa: COVER
                        border_color: "${slate_800}"
                        border_opa: COVER
                        border_width: 1
                        radius: 14
                        pad_all: 4px
                        layout:
                          type: flex
                          flex_flow: column
                          pad_row: 2px
                        widgets:
                          - !include
                              file: ../../ui/templates/climate-fan-option.yaml
                              vars:
                                uid: auto
                                fan_mode: "auto"
                                label: "Automatisch"
                                icon: "${mdi_fan_auto}"
                          - !include
                              file: ../../ui/templates/climate-fan-option.yaml
                              vars:
                                uid: speed_1
                                fan_mode: "1 Lowest"
                                label: "1 • Laagst"
                                icon: "${mdi_fan_speed_1}"
                          - !include
                              file: ../../ui/templates/climate-fan-option.yaml
                              vars:
                                uid: speed_2
                                fan_mode: "2 Low"
                                label: "2 • Laag"
                                icon: "${mdi_fan_speed_2}"
                          - !include
                              file: ../../ui/templates/climate-fan-option.yaml
                              vars:
                                uid: speed_3
                                fan_mode: "3 High"
                                label: "3 • Hoog"
                                icon: "${mdi_fan_speed_3}"
                          - !include
                              file: ../../ui/templates/climate-fan-option.yaml
                              vars:
                                uid: speed_4
                                fan_mode: "4 Highest"
                                label: "4 • Hoogst"
                                icon: "${mdi_fan_plus}"

sensor:
  - platform: homeassistant
    id: climate_woonkamer_target
    entity_id: climate.woonkamer
    attribute: temperature
    on_value:
      - if:
          condition:
            lambda: return id(selected_climate) == "climate_woonkamer";
          then:
            - globals.set:
                id: climate_displayed_target
                value: !lambda return x;
            - script.execute: script_climate_show_target
  - platform: homeassistant
    id: climate_slaapkamer_target
    entity_id: climate.slaapkamer
    attribute: temperature
    on_value:
      - if:
          condition:
            lambda: return id(selected_climate) == "climate_slaapkamer";
          then:
            - globals.set:
                id: climate_displayed_target
                value: !lambda return x;
            - script.execute: script_climate_show_target
  - platform: homeassistant
    id: climate_zolder_target
    entity_id: climate.zolder
    attribute: temperature
    on_value:
      - if:
          condition:
            lambda: return id(selected_climate) == "climate_zolder";
          then:
            - globals.set:
                id: climate_displayed_target
                value: !lambda return x;
            - script.execute: script_climate_show_target

binary_sensor:
  - platform: homeassistant
    id: climate_woonkamer_boost
    entity_id: input_boolean.airco_woonkamer_boost_modus
    on_state:
      - if:
          condition:
            lambda: return id(selected_climate) == "climate_woonkamer";
          then:
            - globals.set:
                id: climate_displayed_boost
                value: !lambda return x;
            - script.execute: script_climate_show_boost
  - platform: homeassistant
    id: climate_slaapkamer_boost
    entity_id: input_boolean.airco_boven_boost_modus
    on_state:
      - if:
          condition:
            lambda: return id(selected_climate) == "climate_slaapkamer";
          then:
            - globals.set:
                id: climate_displayed_boost
                value: !lambda return x;
            - script.execute: script_climate_show_boost
  - platform: homeassistant
    id: climate_zolder_boost
    entity_id: input_boolean.airco_zolder_boost_modus
    on_state:
      - if:
          condition:
            lambda: return id(selected_climate) == "climate_zolder";
          then:
            - globals.set:
                id: climate_displayed_boost
                value: !lambda return x;
            - script.execute: script_climate_show_boost

text_sensor:
  - platform: homeassistant
    id: climate_woonkamer_fan_mode
    entity_id: climate.woonkamer
    attribute: fan_mode
    on_value:
      - if:
          condition:
            lambda: return id(selected_climate) == "climate_woonkamer";
          then:
            - globals.set:
                id: climate_displayed_fan_mode
                value: !lambda return x;
            - script.execute: script_climate_show_fan_mode
  - platform: homeassistant
    id: climate_slaapkamer_fan_mode
    entity_id: climate.slaapkamer
    attribute: fan_mode
    on_value:
      - if:
          condition:
            lambda: return id(selected_climate) == "climate_slaapkamer";
          then:
            - globals.set:
                id: climate_displayed_fan_mode
                value: !lambda return x;
            - script.execute: script_climate_show_fan_mode
  - platform: homeassistant
    id: climate_zolder_fan_mode
    entity_id: climate.zolder
    attribute: fan_mode
    on_value:
      - if:
          condition:
            lambda: return id(selected_climate) == "climate_zolder";
          then:
            - globals.set:
                id: climate_displayed_fan_mode
                value: !lambda return x;
            - script.execute: script_climate_show_fan_mode
  - platform: homeassistant
    id: climate_woonkamer_mode
    entity_id: climate.woonkamer
    on_value:
      - lvgl.label.update:
          id: climate_woonkamer_icon
          text: !lambda return id(climate_mode_icon)[x];
          text_color: !lambda return lv_color_hex(id(climate_mode_color)[x]);
      - if:
          condition:
            lambda: return id(selected_climate) == "climate_woonkamer";
          then:
            - globals.set:
                id: climate_displayed_mode
                value: !lambda return x;
            - script.execute: script_climate_show_mode
  - platform: homeassistant
    id: climate_slaapkamer_mode
    entity_id: climate.slaapkamer
    on_value:
      - lvgl.label.update:
          id: climate_slaapkamer_icon
          text: !lambda return id(climate_mode_icon)[x];
          text_color: !lambda return lv_color_hex(id(climate_mode_color)[x]);
      - if:
          condition:
            lambda: return id(selected_climate) == "climate_slaapkamer";
          then:
            - globals.set:
                id: climate_displayed_mode
                value: !lambda return x;
            - script.execute: script_climate_show_mode
  - platform: homeassistant
    id: climate_zolder_mode
    entity_id: climate.zolder
    on_value:
      - lvgl.label.update:
          id: climate_zolder_icon
          text: !lambda return id(climate_mode_icon)[x];
          text_color: !lambda return lv_color_hex(id(climate_mode_color)[x]);
      - if:
          condition:
            lambda: return id(selected_climate) == "climate_zolder";
          then:
            - globals.set:
                id: climate_displayed_mode
                value: !lambda return x;
            - script.execute: script_climate_show_mode

script:
  - id: script_climate_step
    mode: queued
    parameters:
      delta: float
    then:
      - lambda: |-
          float current_target = id(climate_displayed_target);
          if (std::isnan(current_target)) current_target = 20.0f;
          float new_target = std::max(16.0f, std::min(30.0f, current_target + delta));
          ESP_LOGD("climate", "%s: %.1f -> %.1f (stap %+.1f)",
                   id(selected_climate).c_str(), current_target, new_target, delta);
          id(climate_displayed_target) = new_target;
      - script.execute: script_climate_show_target
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: !lambda |-
              std::string entity_id = id(selected_climate);
              auto separator_position = entity_id.find('_');
              if (separator_position != std::string::npos) entity_id[separator_position] = '.';
              return entity_id;
            temperature: !lambda return str_sprintf("%.1f", id(climate_displayed_target));

  - id: script_climate_show_target
    then:
      - lvgl.label.update:
          id: climate_target_label
          text: !lambda |-
            float displayed_target = id(climate_displayed_target);
            if (std::isnan(displayed_target)) return std::string("--.-°");
            return str_sprintf("%.1f°", displayed_target);

  - id: script_climate_set_mode
    parameters:
      mode: string
    then:
      - if:
          condition:
            lambda: return mode == "dry" || mode == "fan_only";
          then:
            - logger.log:
                format: "modus %s kiezen wordt nog niet ondersteund"
                args: ['mode.c_str()']
          else:
            - globals.set:
                id: climate_displayed_mode
                value: !lambda return mode;
            - script.execute: script_climate_show_mode
            - homeassistant.action:
                action: climate.set_hvac_mode
                data:
                  entity_id: !lambda |-
                    std::string entity_id = id(selected_climate);
                    auto separator_position = entity_id.find('_');
                    if (separator_position != std::string::npos) entity_id[separator_position] = '.';
                    return entity_id;
                  hvac_mode: !lambda return mode;

  - id: script_climate_set_fan_mode
    parameters:
      fan_mode: string
    then:
      - lvgl.widget.hide: climate_fan_popup
      - globals.set:
          id: climate_displayed_fan_mode
          value: !lambda return fan_mode;
      - script.execute: script_climate_show_fan_mode
      - homeassistant.action:
          action: climate.set_fan_mode
          data:
            entity_id: !lambda |-
              std::string entity_id = id(selected_climate);
              auto separator_position = entity_id.find('_');
              if (separator_position != std::string::npos) entity_id[separator_position] = '.';
              return entity_id;
            fan_mode: !lambda return fan_mode;

  - id: script_climate_show_fan_mode
    then:
      - lvgl.label.update:
          id: climate_fan_button_icon
          text: !lambda return id(climate_fan_icon)[id(climate_displayed_fan_mode)];
      - lvgl.label.update:
          id: climate_fan_button_label
          text: !lambda return id(climate_fan_label)[id(climate_displayed_fan_mode)];
      - lvgl.widget.update:
          id: climate_fan_auto_option
          state:
            checked: !lambda return id(climate_displayed_fan_mode) == "auto";
      - lvgl.widget.update:
          id: climate_fan_speed_1_option
          state:
            checked: !lambda return id(climate_displayed_fan_mode) == "1 Lowest";
      - lvgl.widget.update:
          id: climate_fan_speed_2_option
          state:
            checked: !lambda return id(climate_displayed_fan_mode) == "2 Low";
      - lvgl.widget.update:
          id: climate_fan_speed_3_option
          state:
            checked: !lambda return id(climate_displayed_fan_mode) == "3 High";
      - lvgl.widget.update:
          id: climate_fan_speed_4_option
          state:
            checked: !lambda return id(climate_displayed_fan_mode) == "4 Highest";

  - id: script_climate_toggle_boost
    then:
      - globals.set:
          id: climate_displayed_boost
          value: !lambda return !id(climate_displayed_boost);
      - script.execute: script_climate_show_boost
      - homeassistant.action:
          action: input_boolean.toggle
          data:
            entity_id: !lambda return id(climate_boost_entity)[id(selected_climate)];

  - id: script_climate_show_boost
    then:
      - lvgl.widget.update:
          id: climate_boost_button
          state:
            checked: !lambda return id(climate_displayed_boost);
      - lvgl.label.update:
          id: climate_boost_icon
          text_color: !lambda |-
            return lv_color_hex(id(climate_displayed_boost) ? ${orange_400} : ${gray_500});

  - id: script_climate_show_mode
    then:
      - lvgl.widget.update:
          id: [climate_widget_icon, climate_target_label]
          text_color: !lambda return lv_color_hex(id(climate_mode_color)[id(climate_displayed_mode)]);
      - lvgl.widget.update:
          id: climate_mode_off_button
          state:
            checked: !lambda return id(climate_displayed_mode) == "off";
      - lvgl.widget.update:
          id: climate_mode_fan_only_button
          state:
            checked: !lambda return id(climate_displayed_mode) == "fan_only";
      - lvgl.widget.update:
          id: climate_mode_dry_button
          state:
            checked: !lambda return id(climate_displayed_mode) == "dry";
      - lvgl.widget.update:
          id: climate_mode_cool_button
          state:
            checked: !lambda return id(climate_displayed_mode) == "cool";
      - lvgl.widget.update:
          id: climate_mode_heat_button
          state:
            checked: !lambda return id(climate_displayed_mode) == "heat";
      - lvgl.widget.update:
          id: climate_mode_auto_button
          state:
            checked: !lambda return id(climate_displayed_mode) == "auto";

  - id: script_climate_widget
    parameters:
      uid: string
    then:
      - logger.log: 
          format: "%s pressed, selected_climate: %s"
          args: ['uid.c_str()', 'id(selected_climate).c_str()']
      - globals.set:
          id: selected_climate
          value: !lambda return uid;
      - lvgl.widget.update:
          id: climate_woonkamer_button
          state:
            checked: !lambda return id(selected_climate) == "climate_woonkamer";
      - lvgl.widget.update:
          id: climate_slaapkamer_button
          state:
            checked: !lambda return id(selected_climate) == "climate_slaapkamer";
      - lvgl.widget.update:
          id: climate_zolder_button
          state:
            checked: !lambda return id(selected_climate) == "climate_zolder";
      - lambda: |-
          auto *target_sensor = id(climate_target_sensor)[id(selected_climate)];
          id(climate_displayed_target) = target_sensor != nullptr ? target_sensor->state : NAN;
      - script.execute: script_climate_show_target
      - lambda: |-
          auto *mode_sensor = id(climate_mode_sensor)[id(selected_climate)];
          id(climate_displayed_mode) = mode_sensor != nullptr ? mode_sensor->state : "";
      - script.execute: script_climate_show_mode
      - lambda: |-
          auto *fan_sensor = id(climate_fan_sensor)[id(selected_climate)];
          id(climate_displayed_fan_mode) = fan_sensor != nullptr ? fan_sensor->state : "";
      - script.execute: script_climate_show_fan_mode
      - lambda: |-
          auto *boost_sensor = id(climate_boost_sensor)[id(selected_climate)];
          id(climate_displayed_boost) = boost_sensor != nullptr && boost_sensor->has_state() && boost_sensor->state;
      - script.execute: script_climate_show_boost
      - logger.log: 
          format: "script done, selected_climate: %s"
          args: ['id(selected_climate).c_str()']