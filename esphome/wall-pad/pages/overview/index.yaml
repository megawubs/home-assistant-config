packages:
  page_icon: !include 
    file: ../../ui/templates/page-icon.yaml
    vars: 
      uid: overview
      label: "Overzicht"
      icon: "${mdi_home_outline}"
      checked_color: "${indigo_400}"
      page_id: page_overview
  airco_widget: !include
    file: airco.yaml
    vars:
      page_id: page_overview
      container: container_right
      widget: airco_widget


lvgl:
  pages:
    - id: page_overview
      layout: 
        type: grid
        grid_columns: [FR(3), FR(2)]
        pad_column: 15px
        grid_cell_x_align: STRETCH
        grid_cell_y_align: STRETCH
      pad_left: 120px
      pad_top: 94px
      pad_right: 24px
      pad_bottom: 72px
      # height: 742px
      widgets:
        - container:
            id: container_left
            layout:
              type: flex
              flex_flow: column
              flex_align_main: space_evenly
              flex_align_track: start
              flex_align_cross: start
            widgets:
              - container:
                  id: container_1
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_evenly
                    flex_align_track: start
                    flex_align_cross: start
                    pad_column: 12px
                  widgets:
                    - button:
                        bg_color: "${bg_heather}"
                        radius: 14px
                        height: 60px
                        flex_grow: 1
                        id: button_1
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_track: CENTER
                          flex_align_main: CENTER
                          flex_align_cross: CENTER
                        widgets:
                          - label:
                              text_font: icons24
                              text_color: "${text_ink}"
                              text: "${mdi_calendar_plus}"
                          - label:
                              text_font: montserrat_24
                              text_color: "${text_ink}"
                              text: Afspraak
                    - button:
                        radius: 14px
                        height: 60px
                        flex_grow: 1
                        id: button_2
                        text_align: center
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_track: CENTER
                          flex_align_main: CENTER
                          flex_align_cross: CENTER
                        widgets:
                          - label:
                              text_font: icons24
                              text: "${mdi_plus_box_outline}"
                          - label:
                              text_font: montserrat_24
                              text: Taak
                        
        - container:
            id: container_right
            layout:
              type: flex
              flex_flow: column
              flex_align_main: space_evenly
              flex_align_track: start
              flex_align_cross: start
              pad_column: 16px
              pad_row: 16px
            widgets:
              - container:
                  id: airco_widget
                              
              - container:
                  id: container_energy
                  flex_grow: 3
                  bg_color: "${bg_ink}"
                  radius: 14
                  bg_opa: COVER
                  border_opa: COVER
                  border_color: ${border_gunmetal}
                  pad_left: 20px
                  pad_right: 20px
                  pad_top: 18px
                  pad_bottom: 18px
                  widgets:
                    - label:
                        text: "Energy"
              - container:
                  id: container_energy_now
                  flex_grow: 1
                  bg_color: "${bg_ink}"
                  radius: 14
                  bg_opa: COVER
                  border_opa: COVER
                  border_color: ${border_gunmetal}
                  pad_left: 20px
                  pad_right: 20px
                  pad_top: 18px
                  pad_bottom: 18px
                  widgets:
                    - label:
                        text: "Energy now"
